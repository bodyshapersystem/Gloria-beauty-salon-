<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f1eb">
<title>Gloria Beauty DNA</title>
<style>
:root{--wine:#713943;--ink:#4a2927;--taupe:#8c655e;--cream:#fbf6f1;--line:#ddc9bd;--glass:#fffdf9c9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#211715;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}.app{position:relative;max-width:430px;min-height:100dvh;margin:auto;overflow:hidden;background:radial-gradient(circle at 88% 5%,#c99c9566 0,transparent 25%),linear-gradient(180deg,#fdf9f5,#f0e2da);box-shadow:0 0 70px #0008}.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden}.orb{position:absolute;border-radius:50%;filter:blur(45px);opacity:.26;animation:drift 9s ease-in-out infinite}.orb.a{width:180px;height:180px;background:#c47f8c;right:-80px;top:18%}.orb.b{width:150px;height:150px;background:#e5b895;left:-90px;top:58%;animation-delay:-4s}@keyframes drift{50%{transform:translate3d(12px,-25px,0) scale(1.12)}}
.top{position:sticky;top:0;z-index:30;padding:16px 18px 13px;background:#f8f1ebe8;border-bottom:1px solid #fff;backdrop-filter:blur(22px) saturate(1.2)}.brandrow{display:flex;align-items:center;justify-content:space-between}.brand{font:26px Georgia,serif;letter-spacing:.11em}.brand small{display:block;font:7px Inter,sans-serif;letter-spacing:.32em;margin-left:2px}.pulse{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #fff;border-radius:30px;background:#ffffff8c;font-size:9px;color:var(--taupe)}.pulse i{width:7px;height:7px;border-radius:50%;background:#a75364;box-shadow:0 0 0 0 #a7536477;animation:pulse 2s infinite}@keyframes pulse{70%{box-shadow:0 0 0 8px #a7536400}}
.eyebrow{margin:14px 0 4px;font-size:9px;letter-spacing:.23em;text-transform:uppercase;color:var(--taupe)}h1,h2{font-family:Georgia,serif;font-weight:400;margin:0}h1{font-size:31px;line-height:1}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:15px}.tabs button,.choice{position:relative;overflow:hidden;border:1px solid var(--line);background:#ffffff9c;color:#634943;border-radius:18px;padding:11px 7px;font-size:11px;transition:transform .22s cubic-bezier(.2,.8,.2,1),background .3s,color .3s,box-shadow .3s}.tabs button:active,.choice:active{transform:scale(.92)}.tabs button.on,.choice.on{background:var(--wine);color:#fff;border-color:var(--wine);box-shadow:0 7px 18px #71394331}.tabs button.on:after,.choice.on:after{content:"";position:absolute;inset:-100% auto -100% -50%;width:35%;background:#fff4;transform:rotate(20deg);animation:shine .55s ease-out}@keyframes shine{to{left:125%}}
.content{position:relative;z-index:2;padding:14px 13px 80px}.card{background:#ffffff75;border:1px solid white;border-radius:30px;padding:15px 0 19px;box-shadow:0 22px 60px #4a29271c;backdrop-filter:blur(18px)}.head{display:flex;align-items:end;justify-content:space-between;padding:0 18px 12px}.head .eyebrow{margin:0 0 4px}.head h2{font-size:30px}.count{font:italic 14px Georgia,serif;color:var(--taupe)}
.stage{height:405px;margin:0 11px;position:relative;overflow:hidden;border-radius:26px;background:#d9c4b8;isolation:isolate;box-shadow:inset 0 0 0 1px #fff7}.stage:after{content:"";position:absolute;inset:0;z-index:4;background:linear-gradient(180deg,transparent 52%,#2f1e1ca8);pointer-events:none}.hero-photo{width:100%;height:100%;object-fit:cover;object-position:center top;animation:arrive .7s cubic-bezier(.16,1,.3,1)}@keyframes arrive{from{opacity:.35;transform:scale(1.06);filter:blur(7px)}to{opacity:1;transform:scale(1);filter:blur(0)}}.stage.morph .hero-photo{animation:morph .62s cubic-bezier(.22,1,.36,1)}@keyframes morph{0%{filter:blur(0);transform:scale(1)}40%{filter:blur(8px);transform:scale(1.035)}100%{filter:blur(0);transform:scale(1)}}.scan{position:absolute;z-index:3;inset:-40% -70%;background:linear-gradient(105deg,transparent 42%,#fff8 49%,transparent 56%);transform:translateX(-45%);pointer-events:none}.stage.morph .scan{animation:scan .72s ease-out}@keyframes scan{to{transform:translateX(48%)}}
.badge{position:absolute;z-index:7;top:14px;left:14px;display:flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid #ffffff73;border-radius:30px;background:#2117153b;color:#fff;font-size:8px;letter-spacing:.15em;backdrop-filter:blur(10px)}.badge:before{content:"✦";animation:twinkle 1.8s infinite}@keyframes twinkle{50%{transform:rotate(90deg) scale(1.35);opacity:.6}}
.lens{position:absolute;z-index:8;width:104px;padding:5px 5px 8px;border:1px solid #fff9;border-radius:20px;background:#fffde9;box-shadow:0 13px 30px #301b1860;backdrop-filter:blur(8px);transition:.45s cubic-bezier(.16,1,.3,1);animation:float 4.6s ease-in-out infinite}.lens.one{right:12px;top:64px;transform:rotate(3deg)}.lens.two{right:16px;bottom:76px;transform:rotate(-3deg);animation-delay:-2.2s}.lens img{display:block;width:100%;height:74px;border-radius:15px;object-fit:cover;object-position:center top}.lens b{display:block;margin:6px 4px 0;font-size:8px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lens.pop{animation:pop .56s cubic-bezier(.16,1,.3,1)}@keyframes pop{0%{opacity:.25;transform:scale(.62) rotate(-9deg)}70%{transform:scale(1.08) rotate(2deg)}100%{opacity:1}}@keyframes float{50%{translate:0 -6px}}
.caption{position:absolute;z-index:9;bottom:14px;left:14px;right:14px;color:white}.caption small{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#fff9}.caption strong{display:block;margin-top:5px;font:22px/1.1 Georgia,serif}.caption p{margin:6px 0 0;font-size:10px;color:#fffc}
.controls{padding:1px 18px}.group{margin-top:16px}.group p{display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--taupe);margin:0 0 8px}.group p em{font:italic 11px Georgia,serif;letter-spacing:0;text-transform:none;color:#a77e75}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{padding:9px 12px}.summary{position:relative;margin-top:18px;padding:15px 48px 15px 15px;border:1px solid #fff;border-radius:21px;background:linear-gradient(135deg,#f1dfd9,#f8eee9);overflow:hidden}.summary:after{content:"✦";position:absolute;right:17px;top:50%;translate:0 -50%;font-size:19px;color:#9f6670;animation:twinkle 2.3s infinite}.summary small{font-size:8px;letter-spacing:.17em;text-transform:uppercase;color:var(--taupe)}.summary div{font:19px/1.2 Georgia,serif;margin-top:5px}
.reveal{width:100%;margin-top:12px;border:0;border-radius:18px;padding:15px;background:linear-gradient(120deg,#4c302d,#824653,#4c302d);background-size:200% 100%;color:white;font-size:10px;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 12px 26px #4c302d35;animation:gradient 5s linear infinite}@keyframes gradient{to{background-position:200% 0}}.memory{margin-top:13px;padding:18px;border-radius:25px;background:#6e4a40;color:white;box-shadow:0 18px 40px #4d312c35}.memory small{font-size:9px;letter-spacing:.2em}.memory div{font:20px Georgia,serif;margin-top:8px}.memory p{margin:6px 0 0;font-size:10px;color:#fff9}
.modal{position:fixed;z-index:80;inset:0;display:grid;place-items:center;padding:18px;background:#291b19dd;backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:.4s}.modal.open{opacity:1;pointer-events:auto}.final{position:relative;width:min(394px,100%);max-height:90dvh;overflow:auto;padding:22px;border:1px solid #ffffff8c;border-radius:32px;background:linear-gradient(155deg,#fffaf6,#ead8d0);box-shadow:0 40px 100px #0008;transform:translateY(30px) scale(.94);transition:.55s cubic-bezier(.16,1,.3,1)}.modal.open .final{transform:none}.close{position:absolute;right:15px;top:15px;width:38px;height:38px;border:1px solid #dac3b8;border-radius:50%;background:#fff9;color:var(--ink);font-size:18px}.final h2{font-size:34px}.final-grid{display:grid;grid-template-columns:1.2fr .8fr;grid-template-rows:repeat(2,130px);gap:8px;margin-top:17px}.final-grid figure{position:relative;overflow:hidden;margin:0;border-radius:20px}.final-grid figure:first-child{grid-row:1/3}.final-grid img{width:100%;height:100%;object-fit:cover;object-position:center top}.final-grid span{position:absolute;left:8px;bottom:8px;padding:5px 7px;border-radius:9px;background:#20151391;color:white;font-size:8px}.final-copy{margin-top:15px;padding:15px;border-radius:19px;background:#fff9}.final-copy small{color:var(--taupe);text-transform:uppercase;letter-spacing:.18em;font-size:8px}.final-copy div{margin-top:6px;font:19px Georgia,serif}.particle{position:fixed;z-index:81;pointer-events:none;color:#f6d2c4;animation:burst 1.3s ease-out forwards}@keyframes burst{to{translate:var(--x) var(--y);rotate:160deg;opacity:0;scale:.25}}
@media(min-width:650px){body{padding:20px 0}.app{border-radius:35px;min-height:calc(100dvh - 40px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app"><div class="ambient"><i class="orb a"></i><i class="orb b"></i></div>
<header class="top"><div class="brandrow"><div class="brand">GLORIA<small>BEAUTY SALON</small></div><span class="pulse"><i></i>LIVE DNA</span></div><p class="eyebrow">Emmy's Beauty DNA</p><h1>Your look, remembered.</h1><div class="tabs" id="tabs"></div></header>
<main class="content"><section class="card"><div class="head"><div><p class="eyebrow">My preference</p><h2 id="title">Hair</h2></div><span class="count" id="count">3 traits</span></div><div id="sim"></div></section><div class="memory"><small>✦ BEAUTY MEMORY</small><div>Your signature, never lost.</div><p>Every choice stays visible while you build the look.</p></div></main></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeReveal()"><div class="final"><button class="close" onclick="closeReveal()">×</button><p class="eyebrow">Your final selection</p><h2 id="finalTitle">Beauty DNA</h2><div class="final-grid" id="finalGrid"></div><div class="final-copy"><small>Signature formula</small><div id="finalCopy"></div></div></div></div>
<script>
const A="/beauty-dna-package/images/";
const tabs=[["hair","Hair"],["nails","Nails"],["brows","Brows"],["lashes","Lashes"]];
let cat="hair",lastGroup="Length";
const s={hair:{Length:"Long",Texture:"Straight",Color:"Dark Brown"},nails:{Length:"Long",Shape:"Almond",Color:"Funny Bunny"},brows:{Shape:"Natural Arch",Thickness:"Medium",Color:"Dark Brown"},lashes:{Design:"Natural",Type:"Hybrid",Length:"Medium"}};
const opts={hair:{Length:["Short","Medium","Long"],Texture:["Straight","Soft Waves","Defined Waves","Curls","Blowout"],Color:["Black","Blonde","Copper","Dark Brown","Light Brown","Light Brown + Highlights","Balayage","Dark Brown + Almond Highlights"]},nails:{Length:["Short","Medium","Long"],Shape:["Round","Square","Almond","Coffin"],Color:["Red","French","Burgundy","Funny Bunny","Mocha Chrome"]},brows:{Shape:["Soft","Straight","Natural Arch","Defined","High Arch"],Thickness:["Thin","Medium","Thick"],Color:["Light Brown","Brown","Dark Brown","Black"]},lashes:{Design:["Natural","Cat Eye","Wispy"],Type:["Classic","Greek","Hybrid","Mega"],Length:["Short","Medium","Long"]}};
const files={
hair:{Length:{Short:"hair-length-short.webp",Medium:"hair-length-medium.webp",Long:"hair-length-long.webp"},Texture:{Straight:"hair-straight.webp","Soft Waves":"hair-soft-waves.webp","Defined Waves":"hair-defined-waves.webp",Curls:"hair-curls.webp",Blowout:"hair-blowout.webp"},Color:{Black:"hair-color-black.webp",Blonde:"hair-color-blonde.webp",Copper:"hair-color-copper.webp","Dark Brown":"hair-color-dark-brown.webp","Light Brown":"hair-color-light-brown.webp","Light Brown + Highlights":"hair-color-light-highlights.webp",Balayage:"hair-color-balayage.webp","Dark Brown + Almond Highlights":"hair-color-dark-almond.webp"}},
nails:{Length:{Short:"nails-short-round.webp",Medium:"nails-medium-square.webp",Long:"nails-long-almond.webp"},Shape:{Round:"nails-short-round.webp",Square:"nails-medium-square.webp",Almond:"nails-long-almond.webp",Coffin:"nails-long-coffin.webp"},Color:{Red:"nails-color-red.webp","French":"nails-color-french.webp",Burgundy:"nails-color-burgundy.webp","Funny Bunny":"nails-color-funny-bunny.webp","Mocha Chrome":"nails-color-mocha-chrome.webp"}},
brows:{Shape:{Soft:"brows-soft.webp",Straight:"brows-straight.webp","Natural Arch":"brows-soft.webp",Defined:"brows-defined.webp","High Arch":"brows-high-arch.webp"},Thickness:{Thin:"brows-thickness-thin.webp",Medium:"brows-soft.webp",Thick:"brows-thickness-thick.webp"},Color:{"Light Brown":"brows-color-light-brown.webp",Brown:"brows-color-brown.webp","Dark Brown":"brows-color-dark-brown.webp",Black:"brows-color-black.webp"}},
lashes:{Design:{Natural:"lashes-hybrid.webp","Cat Eye":"lashes-cat-eye.webp",Wispy:"lashes-greek.webp"},Type:{Classic:"lashes-classic.webp",Greek:"lashes-greek.webp",Hybrid:"lashes-hybrid.webp",Mega:"lashes-mega.webp"},Length:{Short:"lashes-length-short.webp",Medium:"lashes-hybrid.webp",Long:"lashes-length-long.webp"}}
};
const anchor={hair:"Length",nails:"Shape",brows:"Shape",lashes:"Type"};
function img(group){return A+files[cat][group][s[cat][group]]}
function pick(group,value){s[cat][group]=value;lastGroup=group;render(true,group)}
function switchCat(next){cat=next;lastGroup=anchor[cat];render(false)}
function controls(){return '<div class="controls">'+Object.entries(opts[cat]).map(([g,vs])=>'<div class="group"><p>'+g+'<em>stays active</em></p><div class="choices">'+vs.map(v=>`<button class="choice ${s[cat][g]===v?"on":""}" onclick="pick('${g}',${JSON.stringify(v)})">${v}</button>`).join("")+'</div></div>').join("")+`<div class="summary"><small>Live Beauty DNA</small><div>${Object.values(s[cat]).join(" · ")}</div></div><button class="reveal" onclick="reveal()">Reveal my final DNA ✦</button></div>`}
function stage(popGroup){const groups=Object.keys(s[cat]),base=anchor[cat],lenses=groups.filter(g=>g!==base);return `<div class="stage ${popGroup?"morph":""}"><img class="hero-photo" src="${img(base)}" alt=""><i class="scan"></i><b class="badge">LIVING BEAUTY DNA</b>${lenses.map((g,i)=>`<div class="lens ${i?"two":"one"} ${popGroup===g?"pop":""}"><img src="${img(g)}" alt=""><b>${g}: ${s[cat][g]}</b></div>`).join("")}<div class="caption"><small>Base + live detail lenses</small><strong>${s[cat][base]}</strong><p>${lenses.map(g=>s[cat][g]).join(" · ")}</p></div></div>`}
function render(animate=false,popGroup=""){document.querySelector("#tabs").innerHTML=tabs.map(([id,label])=>`<button class="${cat===id?"on":""}" onclick="switchCat('${id}')">${label}</button>`).join("");document.querySelector("#title").textContent=tabs.find(x=>x[0]===cat)[1];document.querySelector("#count").textContent=Object.keys(s[cat]).length+" traits";document.querySelector("#sim").innerHTML=stage(animate?popGroup:"")+controls()}
function reveal(){const groups=Object.keys(s[cat]),base=anchor[cat];document.querySelector("#finalTitle").textContent=tabs.find(x=>x[0]===cat)[1]+" DNA";document.querySelector("#finalGrid").innerHTML=[base,...groups.filter(g=>g!==base)].map(g=>`<figure><img src="${img(g)}"><span>${g} · ${s[cat][g]}</span></figure>`).join("");document.querySelector("#finalCopy").textContent=Object.values(s[cat]).join(" · ");document.querySelector("#modal").classList.add("open");burst()}
function closeReveal(){document.querySelector("#modal").classList.remove("open")}
function burst(){for(let i=0;i<24;i++){let p=document.createElement("i");p.className="particle";p.textContent=i%3?"✦":"●";p.style.left="50%";p.style.top="45%";p.style.setProperty("--x",(Math.random()*330-165)+"px");p.style.setProperty("--y",(Math.random()*500-250)+"px");p.style.animationDelay=(Math.random()*.18)+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),1600)}}
render();
</script>
</body>
</html>
