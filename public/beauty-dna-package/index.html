<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gloria Beauty DNA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4ece6;color:#4a2927;font-family:Arial,sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:linear-gradient(#fcf8f3,#f1e4dc);box-shadow:0 0 45px #4a292733}.top{position:sticky;top:0;z-index:9;padding:18px 18px 14px;background:#f8f1ebf2;border-bottom:1px solid #fff;backdrop-filter:blur(16px)}.brand{font:28px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:7px Arial;letter-spacing:.33em;margin-left:2px}.eyebrow{margin:15px 0 4px;font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:#8c655e}h1,h2{font-family:Georgia,serif;font-weight:400;margin:0}h1{font-size:32px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:16px}.tabs button,.choice{border:1px solid #dcc8bd;background:#ffffffa8;color:#634943;border-radius:18px;padding:11px 7px;font-size:10px}.tabs button.on,.choice.on{background:#7a3e48;color:white;border-color:#7a3e48}.content{padding:15px 14px 70px}.card{background:#ffffff80;border:1px solid white;border-radius:30px;padding:15px 0 20px;box-shadow:0 18px 55px #4a29271f}.head{padding:0 18px 13px}.head h2{font-size:30px}.canvas{height:390px;margin:0 12px;position:relative;overflow:hidden;border-radius:25px;background:#e8ddd3}.canvas.eyes{height:270px}.canvas>img{width:100%;height:100%;object-fit:cover;transition:.45s}.eyes>img{object-position:center 28%;transform:scale(1.34)}.badge,.caption{position:absolute;z-index:5;border-radius:30px;backdrop-filter:blur(8px)}.badge{top:14px;left:14px;padding:8px 12px;background:#0003;color:white;font-size:8px;letter-spacing:.18em}.caption{bottom:14px;left:14px;padding:9px 13px;background:#fffd;font-size:9px}.controls{padding:2px 18px}.group{margin-top:15px}.group p{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#8c655e;margin:0 0 8px}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{padding:8px 11px}.summary{margin-top:17px;padding:14px;border-radius:20px;background:#f3e5df}.summary small{font-size:8px;letter-spacing:.18em;text-transform:uppercase}.summary div{font:19px Georgia,serif;margin-top:5px}.overlay{position:absolute;inset:0;pointer-events:none}.nail{position:absolute;box-shadow:inset 0 1px 2px #fff,0 1px 2px #41241f55;opacity:.91;transition:.35s}svg{position:absolute;inset:0;width:100%;height:100%}.memory{margin-top:14px;padding:17px;border-radius:25px;background:#6e4a40;color:white}.memory small{letter-spacing:.2em}.memory div{font:20px Georgia,serif;margin-top:8px}
</style></head><body><div class="app"><header class="top"><div class="brand">GLORIA<small>BEAUTY SALON</small></div><p class="eyebrow">Emmy's Beauty DNA</p><h1>Your look, remembered.</h1><div class="tabs" id="tabs"></div></header><main class="content"><section class="card"><div class="head"><p class="eyebrow">My preference</p><h2 id="title">Hair</h2></div><div id="sim"></div></section><div class="memory"><small>✦ BEAUTY MEMORY</small><div>Your signature look, always remembered.</div></div></main></div>
<script>
const A="./images/",tabs=[["hair","Hair"],["nails","Nails"],["brows","Brows"],["lashes","Lashes"]];
let cat="hair",s={hair:{Length:"Long",Texture:"Straight",Color:"Dark Brown"},nails:{Length:"Long",Shape:"Almond",Color:"Funny Bunny"},brows:{Shape:"Natural Arch",Thickness:"Medium",Color:"Dark Brown"},lashes:{Design:"Natural",Type:"Hybrid",Length:"Medium"}},last={hair:"Color",nails:"Color",brows:"Color",lashes:"Type"};
const opts={hair:{Length:["Short","Medium","Long"],Texture:["Straight","Soft Waves","Defined Waves","Curls","Blowout"],Color:["Black","Blonde","Copper","Dark Brown","Light Brown","Light Brown + Highlights","Balayage","Dark Brown + Almond Highlights"]},nails:{Length:["Short","Medium","Long"],Shape:["Round","Square","Almond","Coffin"],Color:["Red","French","Burgundy","Funny Bunny","Mocha Chrome"]},brows:{Shape:["Soft","Straight","Natural Arch","Defined","High Arch"],Thickness:["Thin","Medium","Thick"],Color:["Light Brown","Brown","Dark Brown","Black"]},lashes:{Design:["Natural","Cat Eye","Wispy"],Type:["Classic","Greek","Hybrid","Mega"],Length:["Short","Medium","Long"]}};
function controls(){return '<div class="controls">'+Object.entries(opts[cat]).map(([g,vs])=>'<div class="group"><p>'+g+'</p><div class="choices">'+vs.map(v=>`<button class="choice ${s[cat][g]===v?"on":""}" onclick="pick('${g}','${v}')">${v}</button>`).join("")+'</div></div>').join("")+`<div class="summary"><small>Selected look</small><div>${Object.values(s[cat]).join(" · ")}</div></div></div>`}
function pick(g,v){s[cat][g]=v;last[cat]=g;render()}
const hairLength={Short:"hair-length-short.webp",Medium:"hair-length-medium.webp",Long:"hair-length-long.webp"},hairTexture={Straight:"hair-straight.webp","Soft Waves":"hair-soft-waves.webp","Defined Waves":"hair-defined-waves.webp",Curls:"hair-curls.webp",Blowout:"hair-blowout.webp"},hairColor={Black:"hair-color-black.webp",Blonde:"hair-color-blonde.webp",Copper:"hair-color-copper.webp","Dark Brown":"hair-color-dark-brown.webp","Light Brown":"hair-color-light-brown.webp","Light Brown + Highlights":"hair-color-light-highlights.webp",Balayage:"hair-color-balayage.webp","Dark Brown + Almond Highlights":"hair-color-dark-almond.webp"};
function hair(){let x=s.hair,file=last.hair==="Length"?hairLength[x.Length]:last.hair==="Texture"?hairTexture[x.Texture]:hairColor[x.Color];return `<div class="canvas"><img src="${A+file}"><b class="badge">REAL PHOTO PREVIEW</b><span class="caption">${x.Length} · ${x.Texture} · ${x.Color}</span></div>`}
const nailLength={Short:"nails-short-round.webp",Medium:"nails-medium-square.webp",Long:"nails-long-almond.webp"},nailShape={Round:"nails-short-round.webp",Square:"nails-medium-square.webp",Almond:"nails-long-almond.webp",Coffin:"nails-long-coffin.webp"},nailColor={Red:"nails-color-red.webp",French:"nails-color-french.webp",Burgundy:"nails-color-burgundy.webp","Funny Bunny":"nails-color-funny-bunny.webp","Mocha Chrome":"nails-color-mocha-chrome.webp"};
function nails(){let x=s.nails,file=last.nails==="Length"?nailLength[x.Length]:last.nails==="Shape"?nailShape[x.Shape]:nailColor[x.Color];return `<div class="canvas"><img src="${A+file}"><b class="badge">REAL PHOTO PREVIEW</b><span class="caption">${x.Length} · ${x.Shape} · ${x.Color}</span></div>`}
const browPhotos={Soft:"brows-soft.webp",Straight:"brows-straight.webp","Natural Arch":"brows-soft.webp",Defined:"brows-defined.webp","High Arch":"brows-high-arch.webp"};
const browThickness={Thin:"brows-thickness-thin.webp",Medium:"brows-soft.webp",Thick:"brows-thickness-thick.webp"},browColor={"Light Brown":"brows-color-light-brown.webp",Brown:"brows-color-brown.webp","Dark Brown":"brows-color-dark-brown.webp",Black:"brows-color-black.webp"},lashDesign={Natural:"lashes-hybrid.webp","Cat Eye":"lashes-cat-eye.webp",Wispy:"lashes-greek.webp"},lashType={Classic:"lashes-classic.webp",Greek:"lashes-greek.webp",Hybrid:"lashes-hybrid.webp",Mega:"lashes-mega.webp"},lashLength={Short:"lashes-length-short.webp",Medium:"lashes-hybrid.webp",Long:"lashes-length-long.webp"};
function eyes(){let x=s[cat],file=cat==="brows"?(last.brows==="Shape"?browPhotos[x.Shape]:last.brows==="Thickness"?browThickness[x.Thickness]:browColor[x.Color]):(last.lashes==="Design"?lashDesign[x.Design]:last.lashes==="Type"?lashType[x.Type]:lashLength[x.Length]);return `<div class="canvas eyes"><img src="${A+file}"><b class="badge">REAL PHOTO PREVIEW</b><span class="caption">${Object.values(x).join(" · ")}</span></div>`}
async function hydrate(){for(const img of document.querySelectorAll("#sim img")){const src=img.getAttribute("src");if(src&&src.endsWith(".webp")){try{const b64=await fetch(src+".b64").then(r=>{if(!r.ok)throw Error(r.status);return r.text()});img.src="data:image/webp;base64,"+b64.trim()}catch(e){img.alt="Photo unavailable"}}}}
function render(){document.querySelector("#tabs").innerHTML=tabs.map(([id,l])=>`<button class="${cat===id?"on":""}" onclick="cat='${id}';render()">${l}</button>`).join("");document.querySelector("#title").textContent=tabs.find(t=>t[0]===cat)[1];document.querySelector("#sim").innerHTML=(cat==="hair"?hair():cat==="nails"?nails():eyes())+controls();hydrate()}
render();
</script></body></html>
