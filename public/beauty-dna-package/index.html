<body>
<div class="app"><div class="ambient"><i class="orb a"></i><i class="orb b"></i></div>
<header class="top"><div class="brandrow"><div class="brand">GLORIA<small>BEAUTY SALON</small></div><span class="pulse"><i></i>LIVE DNA</span></div><p class="eyebrow">Emmy's Beauty DNA</p><h1>Your look, remembered.</h1><div class="tabs" id="tabs"></div></header>

<script>
const A="/beauty-dna-package/images/";
const tabs=[["hair","Hair"],["nails","Nails"],["brows","Brows"],["lashes","Lashes"]];
let cat="hair",lastGroup="Length";
const activeGroup={hair:"Length",nails:"Shape",brows:"Shape",lashes:"Type"};
const s={hair:{Length:"Long",Texture:"Straight",Color:"Dark Brown"},nails:{Length:"Long",Shape:"Almond",Color:"Funny Bunny"},brows:{Shape:"Natural Arch",Thickness:"Medium",Color:"Dark Brown"},lashes:{Design:"Natural",Type:"Hybrid",Length:"Medium"}};

const files={
hair:{Length:{Short:"hair-length-short.webp",Medium:"hair-length-medium.webp",Long:"hair-length-long.webp"},Texture:{Straight:"hair-straight.webp","Soft Waves":"hair-soft-waves.webp","Defined Waves":"hair-defined-waves.webp",Curls:"hair-curls.webp",Blowout:"hair-blowout.webp"},Color:{Black:"hair-color-black.webp",Blonde:"hair-color-blonde.webp",Copper:"hair-color-copper.webp","Dark Brown":"hair-color-dark-brown.webp","Light Brown":"hair-color-light-brown.webp","Light Brown + Highlights":"hair-color-light-highlights.webp",Balayage:"hair-color-balayage.webp","Dark Brown + Almond Highlights":"hair-color-dark-almond.webp"}},
nails:{Length:{Short:"nails-short-round.webp",Medium:"nails-medium-square.webp",Long:"nails-long-almond.webp"},Shape:{Round:"nails-short-round.webp",Oval:"nails-long-almond.webp",Square:"nails-medium-square.webp",Almond:"nails-long-almond.webp",Coffin:"nails-long-coffin.webp"},Color:{Red:"nails-color-red.webp","French":"nails-color-french.webp",Burgundy:"nails-color-burgundy.webp","Funny Bunny":"nails-color-funny-bunny.webp","Mocha Chrome":"nails-color-mocha-chrome.webp"}},
brows:{Shape:{Soft:"brows-soft.webp",Straight:"brows-straight.webp","Natural Arch":"brows-soft.webp",Defined:"brows-defined.webp","High Arch":"brows-high-arch.webp"},Thickness:{Thin:"brows-thickness-thin.webp",Medium:"brows-soft.webp",Thick:"brows-thickness-thick.webp"},Color:{"Light Brown":"brows-color-light-brown.webp",Brown:"brows-color-brown.webp","Dark Brown":"brows-color-dark-brown.webp",Black:"brows-color-black.webp"}},
lashes:{Design:{Natural:"lashes-hybrid.webp","Cat Eye":"lashes-cat-eye.webp",Wispy:"lashes-greek.webp"},Type:{Classic:"lashes-classic.webp",Greek:"lashes-greek.webp",Hybrid:"lashes-hybrid.webp",Mega:"lashes-mega.webp"},Length:{Short:"lashes-length-short.webp",Medium:"lashes-hybrid.webp",Long:"lashes-length-long.webp"}}
};
const anchor={hair:"Length",nails:"Shape",brows:"Shape",lashes:"Type"};
function img(group,category=cat){return A+files[category][group][s[category][group]]}
function slug(value){return value.toLowerCase().replace(/\+/g,"plus").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
const exactHair=new Set([
  "long/straight/black","long/straight/blonde","long/straight/copper","long/straight/dark-brown",
  "long/straight/light-brown","long/straight/light-brown-plus-highlights","long/straight/balayage",
  "long/straight/dark-brown-plus-almond-highlights","long/soft-waves/dark-brown",
  "long/defined-waves/dark-brown","long/curls/dark-brown","long/blowout/dark-brown",
  "short/straight/black","short/straight/blonde","short/straight/copper","short/straight/dark-brown",
  "short/straight/light-brown","short/straight/light-brown-plus-highlights","short/straight/balayage",
  "short/straight/dark-brown-plus-almond-highlights","medium/straight/black","medium/straight/blonde",
  "medium/straight/copper","medium/straight/dark-brown","medium/straight/light-brown",
  "medium/straight/light-brown-plus-highlights","medium/straight/balayage",
  "medium/straight/dark-brown-plus-almond-highlights"
]);
const exactNails=new Set([
  "short/round/red","short/round/french","short/round/funny-bunny",
  "medium/almond/burgundy","medium/almond/mocha-chrome","medium/square/funny-bunny",
  "long/almond/red","long/almond/french","long/almond/burgundy","long/almond/funny-bunny",
  "long/almond/mocha-chrome","long/coffin/red","long/coffin/funny-bunny"
]);
const exactLashes=new Set([
  "natural/classic/medium","natural/hybrid/short","natural/hybrid/medium","natural/hybrid/long",
  "natural/mega/medium","cat-eye/hybrid/medium","wispy/greek/medium"
]);
const exactBrows=new Set([
  "natural-arch/medium/dark-brown","soft/medium/light-brown","soft/medium/brown",
  "soft/medium/dark-brown","soft/medium/black","soft/thin/dark-brown","soft/thick/dark-brown",
  "straight/medium/dark-brown","defined/medium/dark-brown","high-arch/medium/dark-brown"
]);
function comboImg(category=cat){
  if(category==="hair"){
    const length=slug(s.hair.Length),texture=slug(s.hair.Texture),color=slug(s.hair.Color);
    const key=[length,texture,color].join("/");
    const fallbacks=[key,[length,"straight",color].join("/"),[length,texture,"dark-brown"].join("/"),[length,"straight","dark-brown"].join("/")];
    const match=fallbacks.find(k=>exactHair.has(k));
    if(match)return hairPath(match);
  }
  if(category==="nails"){
    const length=slug(s.nails.Length),shape=slug(s.nails.Shape),color=slug(s.nails.Color);
    const key=[length,shape,color].join("/");
    const shapeFallback=shape==="oval"?"almond":shape;
    const sameLength=[...exactNails].filter(k=>k.startsWith(length+"/"));
    const fallbacks=[
      key,
      [length,shapeFallback,color].join("/"),
      [length,shape,"funny-bunny"].join("/"),
      [length,shapeFallback,"funny-bunny"].join("/"),
      [length,"almond",color].join("/"),
      [length,"round",color].join("/")
    ];
    const match=fallbacks.find(k=>exactNails.has(k))||sameLength.find(k=>k.endsWith("/"+color))||sameLength[0];
    if(match)return "/beauty-dna-package/matrix/nails/"+match+".webp";
  }
  if(category==="lashes"){
    const design=slug(s.lashes.Design),type=slug(s.lashes.Type),length=slug(s.lashes.Length);
    const key=[design,type,length].join("/");
    const sameDesign=[...exactLashes].filter(k=>k.startsWith(design+"/"));
    const fallbacks=[key,[design,type,"medium"].join("/"),[design,"hybrid",length].join("/"),[design,"hybrid","medium"].join("/"),["natural",type,length].join("/"),["natural","hybrid",length].join("/"),["natural","hybrid","medium"].join("/")];
    const match=fallbacks.find(k=>exactLashes.has(k))||sameDesign.find(k=>k.includes("/"+type+"/"))||sameDesign.find(k=>k.endsWith("/"+length))||sameDesign[0];
    if(match)return "/beauty-dna-package/matrix/lashes/"+match+".webp";
  }
  if(category==="brows"){
    const shape=slug(s.brows.Shape),thickness=slug(s.brows.Thickness),color=slug(s.brows.Color);
    const key=[shape,thickness,color].join("/");
    const sameShape=[...exactBrows].filter(k=>k.startsWith(shape+"/"));
    const fallbacks=[key,[shape,"medium",color].join("/"),[shape,thickness,"dark-brown"].join("/"),[shape,"medium","dark-brown"].join("/"),["soft",thickness,color].join("/"),["soft","medium",color].join("/")];
    const match=fallbacks.find(k=>exactBrows.has(k))||sameShape.find(k=>k.endsWith("/"+color))||sameShape.find(k=>k.includes("/"+thickness+"/"))||sameShape[0];
    if(match)return "/beauty-dna-package/matrix/brows/"+match+".webp";
  }
  return img(activeGroup[category],category)
}
function hairPath(key){return "/beauty-dna-package/matrix/hair/"+key+(key.startsWith("short/straight/")&&key!=="short/straight/dark-brown"?".png":".webp")}
function pick(group,value){s[cat][group]=value;lastGroup=group;activeGroup[cat]=group;render(true,group)}
function switchCat(next){cat=next;lastGroup=activeGroup[cat];render(false)}
function controls(){return '<div class="controls">'+Object.entries(opts[cat]).map(([g,vs])=>'<div class="group"><p>'+g+'<em>stays active</em></p><div class="choices">'+vs.map(v=>`<button class="choice ${s[cat][g]===v?"on":""}" onclick="pick('${g}','${v}')">${v}</button>`).join("")+'</div></div>').join("")+`<div class="summary"><small>Live Beauty DNA</small><div>${Object.values(s[cat]).join(" · ")}</div></div><button class="reveal" onclick="reveal()">Reveal my final DNA ✦</button></div>`}
function fxLabel(group){return ({Length:"Transforming length",Color:"Infusing color",Texture:"Restyling",Shape:"Sculpting shape",Design:"Mapping the look",Type:"Building volume",Thickness:"Refining density"}[group]||"Transforming")}
function toolFor(group){if(cat==="nails")return"polish";if(cat==="lashes")return"tweezers";if(cat==="brows")return"brows";if(group==="Length")return"scissors";if(group==="Color")return"tint";return"dryer"}
function stage(popGroup){const groups=Object.keys(s[cat]),heroGroup=activeGroup[cat];return `<div class="stage ${popGroup?"morph fx-"+popGroup:""}"><img class="hero-photo" src="${comboImg()}" onerror="this.onerror=null;this.src='${img(heroGroup)}'" alt="${tabs.find(x=>x[0]===cat)[1]}: ${Object.values(s[cat]).join(', ')}"><i class="scan"></i><div class="transition-fx">${popGroup?`<i class="tool ${toolFor(popGroup)}"></i><span>${fxLabel(popGroup)}</span>`:""}</div><b class="badge">LIVING BEAUTY DNA</b><div class="trait-stack">${groups.map(g=>`<b class="trait-pill ${popGroup===g?"active":""}">${s[cat][g]}</b>`).join("")}</div><div class="caption"><small>Full-screen live selection</small><strong>${s[cat][heroGroup]}</strong><p>${Object.values(s[cat]).join(" · ")}</p></div></div>`}
function render(animate=false,popGroup=""){document.querySelector("#tabs").innerHTML=tabs.map(([id,label])=>`<button class="${cat===id?"on":""}" onclick="switchCat('${id}')">${label}</button>`).join("");document.querySelector("#title").textContent=tabs.find(x=>x[0]===cat)[1];document.querySelector("#count").textContent=Object.keys(s[cat]).length+" traits";document.querySelector("#sim").innerHTML=stage(animate?popGroup:"")+controls()}
function reveal(){document.querySelector("#finalTitle").textContent="Complete Beauty DNA";document.querySelector("#finalGrid").innerHTML=tabs.map(([id,label])=>`<figure><img src="${comboImg(id)}" onerror="this.onerror=null;this.src='${img(activeGroup[id],id)}'"><span>${label} · ${Object.values(s[id]).join(" · ")}</span></figure>`).join("");document.querySelector("#finalCopy").textContent=tabs.map(([id,label])=>label+": "+Object.values(s[id]).join(" · ")).join("  |  ");document.querySelector("#modal").classList.add("open");burst()}
function closeReveal(){document.querySelector("#modal").classList.remove("open")}
function burst(){for(let i=0;i<24;i++){let p=document.createElement("i");p.className="particle";p.textContent=i%3?"✦":"●";p.style.left="50%";p.style.top="45%";p.style.setProperty("--x",(Math.random()*330-165)+"px");p.style.setProperty("--y",(Math.random()*500-250)+"px");p.style.animationDelay=(Math.random()*.18)+"s";document.body.appendChild(p);setTimeout(()=>p.remove(),1600)}}
render();
</script>
</body>
</html>
