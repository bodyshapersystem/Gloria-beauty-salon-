<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BellezaBlitz Host Copilot</title><style>:root{--bg:#fffaf8;--panel:#fff;--ink:#2f292b;--muted:#8e8185;--rose:#eb6fa0;--rose2:#ffdce9;--blush:#fff1f6;--cream:#f8efe9;--line:#eadfe3;--green:#eaf8ef;--yellow:#fff6d8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffaf8,#fff 55%,#fff8fb);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}.app{max-width:960px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.logo{font-size:13px;font-weight:900;letter-spacing:.08em}.logo b{color:var(--rose)}.live{font-size:10px;background:var(--blush);color:#a74670;border:1px solid #f1bfd2;border-radius:999px;padding:7px 10px}.eyebrow{font-size:10px;color:#b75b7e;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.searchView h1{font-size:32px;line-height:1.05;margin:7px 0}.searchView p{margin:0 0 15px;color:var(--muted)}.searchBox{background:#fff;border:1px solid var(--line);border-radius:22px;padding:13px;box-shadow:0 12px 35px rgba(125,79,94,.08)}.searchRow{display:grid;grid-template-columns:1fr 150px;gap:8px}.searchRow input,.quickSearch,.liveInputs input{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;color:var(--ink)}.primary{border:0;background:var(--rose);color:#fff;border-radius:13px;padding:12px 14px;font-weight:850;cursor:pointer}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:11px;max-height:66vh;overflow:auto}.item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;cursor:pointer}.item b{display:block;font-size:13px}.item span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.productView{display:none}.productTop{position:sticky;top:0;z-index:20;background:rgba(255,250,248,.95);backdrop-filter:blur(12px);padding:7px 0 10px;display:flex;gap:8px}.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 12px;font-weight:850;color:var(--ink);cursor:pointer}.quickSearch{flex:1;border-radius:999px}.hero{background:linear-gradient(135deg,#fff,#fff3f8);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 14px 36px rgba(125,79,94,.07)}.hero h1{font-size:30px;line-height:1.05;margin:6px 0}.meta{font-size:11px;color:var(--muted)}.mainSay{background:var(--rose2);border-radius:18px;padding:16px;margin-top:13px}.mainSay small{display:block;font-size:10px;font-weight:900;letter-spacing:.08em;color:#9c4d6e}.mainSay div{font-size:23px;font-weight:900;line-height:1.18;margin-top:6px}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.chip{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.chip b{display:block;font-size:10px;color:#aa5d79;margin-bottom:5px;text-transform:uppercase}.chip div{font-size:14px;line-height:1.35;font-weight:700}.support{display:grid;grid-template-columns:1.2fr .8fr;gap:9px;margin-top:9px}.supportBox,.closeBox{border-radius:17px;padding:14px;border:1px solid var(--line)}.supportBox{background:#fff}.closeBox{background:var(--cream)}.supportBox b,.closeBox b{display:block;font-size:10px;color:#a45b76;text-transform:uppercase;margin-bottom:6px}.supportBox div,.closeBox div{font-size:15px;line-height:1.4}.liveInputs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.liveInputs label{display:block;font-size:9px;color:var(--muted);margin:0 0 3px 2px}.save{width:100%;margin-top:7px}.mini{margin-top:10px;background:var(--green);border:1px solid #d6eedf;border-radius:14px;padding:10px 12px;font-size:12px}.more{margin-top:10px}.more details{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.more summary{cursor:pointer;font-weight:850;color:#8f5870}.techGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.tech{background:#fffafc;border-radius:12px;padding:10px}.tech b{font-size:10px;color:#a55c77;text-transform:uppercase;display:block;margin-bottom:4px}.tech div{font-size:13px;line-height:1.4}.controls{position:sticky;bottom:8px;margin-top:12px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:19px;padding:8px;box-shadow:0 15px 35px rgba(113,72,87,.14)}.controlsGrid{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:6px}.controls button{border:0;border-radius:12px;padding:11px 8px;background:#f8f0f3;color:var(--ink);font-size:11px;font-weight:850;cursor:pointer}.controls .primary{background:var(--rose);color:#fff}.source{font-size:9px;color:#a69a9e;margin:10px 3px 78px}.source a{color:#b44e76}@media(max-width:720px){.app{padding:10px}.searchView h1,.hero h1{font-size:26px}.searchRow,.list,.chips,.support,.liveInputs,.techGrid{grid-template-columns:1fr}.mainSay div{font-size:20px}.controlsGrid{grid-template-columns:1fr 1fr}.controls .primary{grid-column:1/-1}}</style></head><body><div class="app"><div class="top"><div class="logo">BELLEZA<b>BLITZ</b> • HOST COPILOT</div><div class="live">● LIVE READY</div></div><section id="searchView" class="searchView"><div class="eyebrow">Tu apoyo durante el Live 💕</div><h1>Busca el producto.<br>Y habla con seguridad.</h1><p>Elige uno y te dejo solo lo que necesitas decir.</p><div class="searchBox"><div class="searchRow"><input id="q" placeholder="Ej. Fekkai, Tatcha, lip gloss..." oninput="filterList()"><button class="primary" onclick="openFirst()">VER PRODUCTO</button></div><div id="list" class="list"></div></div></section><section id="productView" class="productView"><div class="productTop"><button class="back" onclick="goBack()">← Otro producto</button><input id="quickSearch" class="quickSearch" placeholder="Busca otro aquí..." onkeydown="if(event.key==='Enter')quickOpen()"></div><div id="productContent"></div></section></div><script>let DB=[],shown=[],cur=null,activeMode='hook',lines=[],idx=0;const INTERNAL=JSON.parse(localStorage.getItem('bb_live_data')||'{}');const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');Promise.all(['/bellezablitz-products.json','/bellezablitz-products-wave2.json','/bellezablitz-products-wave3.json'].map(u=>fetch(u).then(r=>r.json()))).then(parts=>{const m=new Map();parts.flat().forEach(p=>m.set(p.id,p));DB=[...m.values()];shown=DB;renderList()}).catch(()=>document.getElementById('list').innerHTML='<div class="item"><b>No pude cargar la base.</b><span>Recarga la página 💕</span></div>');function renderList(){const el=document.getElementById('list');el.innerHTML=shown.map(p=>`<div class="item" onclick="openProduct('${p.id}')"><b>${p.brand} · ${p.name}</b><span>${p.cat} · ${p.status||''}</span></div>`).join('')||'<div class="item"><b>No encontré coincidencias.</b><span>Prueba con marca o una palabra del producto.</span></div>'}function filterList(){const x=norm(document.getElementById('q').value);shown=DB.filter(p=>norm(`${p.brand} ${p.name} ${p.cat} ${p.problem}`).includes(x));renderList()}function openFirst(){if(shown[0])openProduct(shown[0].id)}function goBack(){document.getElementById('productView').style.display='none';document.getElementById('searchView').style.display='block';document.getElementById('q').value='';shown=DB;renderList();window.scrollTo(0,0)}function quickOpen(){const x=norm(document.getElementById('quickSearch').value);const p=DB.find(p=>norm(`${p.brand} ${p.name}`).includes(x));if(p){document.getElementById('quickSearch').value='';openProduct(p.id)}}function openProduct(id){cur=DB.find(p=>p.id===id);if(!cur)return;document.getElementById('searchView').style.display='none';document.getElementById('productView').style.display='block';window.scrollTo(0,0);const x=INTERNAL[id]||{};const close=x.price?`“Ok chicas, vamos en ${x.price}. ¿Quién se lo lleva?”`:'Confirma el precio del Live antes de lanzar.';document.getElementById('productContent').innerHTML=`<div class="hero"><div class="eyebrow">${cur.cat} · ${cur.status||'Ready'}</div><h1>${cur.brand}<br>${cur.name}</h1><div class="meta">${cur.size||''} · Retail ref ${cur.retailRef||'verificar'} · GBI ${cur.gbiPrice||'verificar'}</div><div class="mainSay"><small>⚡ DI ESTO AHORA</small><div id="teleline">${cur.hook}</div></div><div class="chips"><div class="chip"><b>Qué es</b><div>${cur.what}</div></div><div class="chip"><b>Qué vende</b><div>${cur.problem}</div></div><div class="chip"><b>3 puntos clave</b><div>${cur.benefits}</div></div></div><div class="support"><div class="supportBox"><b>Si te preguntan…</b><div>${cur.objection}</div></div><div class="closeBox"><b>Cierre</b><div>${close}</div></div></div><div class="support"><div class="supportBox"><b>Cómo se usa</b><div>${cur.how}</div></div><div class="supportBox"><b>Cross-sell</b><div>${cur.cross}</div></div></div><div class="liveInputs"><div><label>PRECIO DEL LIVE</label><input id="lp" value="${x.price||''}" placeholder="Ej. $12"></div><div><label>CUÁNTOS HAY</label><input id="lq" value="${x.qty||''}" placeholder="Ej. 4"></div><div><label>CONDICIÓN</label><input id="lc" value="${x.cond||''}" placeholder="sealed / unboxed"></div></div><button class="primary save" onclick="saveLive()">Guardar para este Live</button><div class="mini">💕 No tienes que leer todo. Hook → 2 beneficios → pregunta → precio → cierre.</div></div><div class="more"><details><summary>Ver info técnica del producto</summary><div class="techGrid"><div class="tech"><b>Para quién es</b><div>${cur.forwho}</div></div><div class="tech"><b>Ingredientes / activos</b><div>${cur.ingredients}</div></div><div class="tech"><b>Retail / referencia</b><div>${cur.retailRef||'Verificar'}</div></div><div class="tech"><b>Estado público</b><div>${cur.status||'Verificar'}</div></div></div></details></div><div class="controls"><div class="controlsGrid"><button class="primary" onclick="blankLine()">ME QUEDÉ EN BLANCO →</button><button onclick="showMode('hook')">OTRO HOOK</button><button onclick="showMode('educa')">QUÉ CUENTO</button><button onclick="showMode('reset')">NUEVA GENTE</button><button onclick="showMode('close')">CERRAR</button></div></div><div class="source">Fuente: <a href="${cur.source}" target="_blank">ver fuente oficial</a> · No inventes beneficios, cantidad ni precio.</div>`;activeMode='hook';lines=getLines('hook');idx=0}function saveLive(){const lp=document.getElementById('lp'),lq=document.getElementById('lq'),lc=document.getElementById('lc');INTERNAL[cur.id]={price:lp.value.trim(),qty:lq.value.trim(),cond:lc.value.trim()};localStorage.setItem('bb_live_data',JSON.stringify(INTERNAL));openProduct(cur.id)}function getLines(m){const x=INTERNAL[cur.id]||{};const price=x.price||'___';return{hook:[cur.hook,`“Chicas, si esto les pasa, miren ${cur.name} de ${cur.brand}.”`,`“A ver, ¿quién aquí usaría esto en su rutina?”`],educa:[`“Lo importante de este producto es esto: ${cur.benefits}”`,`“Se usa así: ${cur.how}”`,`“Si me preguntan para quién es: ${cur.forwho}”`],reset:[`“Para las que acaban de entrar, bienvenidas 💕 Ahora mismo estamos con ${cur.name} de ${cur.brand}.”`,`“Si acabas de llegar, quédate porque los deals se mueven rápido.”`,`“Les resumo rápido: ${cur.what}”`],close:[x.price?`“Ok chicas, vamos en ${price}. ¿Quién se lo lleva?”`:'“Déjenme confirmar el precio del Live antes de lanzarlo.”',x.qty?`“Tenemos ${x.qty} confirmadas.”`:'“No les voy a inventar cantidad; déjenme verificar stock.”',`“Y si te llevaste esto, mira lo que combina: ${cur.cross}.”`]}[m]||[]}function setTele(text){const el=document.getElementById('teleline');if(el)el.textContent=text}function showMode(m){activeMode=m;lines=getLines(m);idx=0;if(lines.length)setTele(lines[0])}function blankLine(){const pool=[cur.hook,`“Este es ${cur.name} de ${cur.brand}. Lo que me gusta es: ${cur.benefits}”`,`“¿A quién le pasa esto? Las leo en el chat.”`,`“Se usa así: ${cur.how}”`,`“Si te gustó esto, mira con qué lo combino: ${cur.cross}.”`];const x=INTERNAL[cur.id]||{};if(x.price)pool.push(`“Ok chicas, vamos en ${x.price}. ¿Quién se lo lleva?”`);idx=(idx+1)%pool.length;setTele(pool[idx])}</script></body></html>
