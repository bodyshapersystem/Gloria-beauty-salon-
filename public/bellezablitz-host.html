<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BellezaBlitz Host Copilot</title><style>:root{--bg:#09090a;--p:#151517;--p2:#1c1c1f;--l:#2d2d31;--t:#f8f6f2;--m:#aaa49e;--pink:#ff3da8;--soft:#ffd1e8;--cream:#efe7dc;--green:#b9f3c7;--yellow:#ffe59b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,sans-serif}.app{max-width:1420px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:13px;font-weight:900;letter-spacing:.14em}.brand b{color:var(--pink)}.live{font-size:10px;border:1px solid #74234e;background:#2a1021;color:#ffc0e1;padding:7px 10px;border-radius:999px}.search{display:grid;grid-template-columns:1fr 145px;gap:8px;background:var(--p);border:1px solid var(--l);padding:11px;border-radius:16px;margin-bottom:11px}input,select,textarea{width:100%;background:#0d0d0f;color:#fff;border:1px solid var(--l);border-radius:11px;padding:11px;font:inherit}button{border:0;border-radius:11px;padding:11px;font-weight:800;cursor:pointer}.pink{background:var(--pink);color:white}.layout{display:grid;grid-template-columns:320px 1fr;gap:11px}.card{background:var(--p);border:1px solid var(--l);border-radius:17px;padding:14px}.cap{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--m);margin-bottom:9px}.list{max-height:75vh;overflow:auto;display:flex;flex-direction:column;gap:6px}.item{background:#0d0d0f;border:1px solid var(--l);padding:9px;border-radius:11px;cursor:pointer}.item:hover{border-color:#693150}.item b{display:block;font-size:12px}.item span{font-size:10px;color:#888}.hero{display:grid;grid-template-columns:1fr 270px;gap:9px}.hl{background:linear-gradient(145deg,#28101f,#121214);border:1px solid #5d2345;border-radius:17px;padding:17px}.hl h1{font-size:26px;line-height:1.08;margin:9px 0 5px}.tag{display:inline-block;background:#35132a;color:#ffb7dd;border-radius:999px;padding:5px 8px;font-size:10px;margin-right:5px}.price{background:var(--cream);color:#111;border-radius:17px;padding:17px}.price small{font-size:10px;color:#6b645c;letter-spacing:.1em}.price strong{display:block;font-size:32px;margin:3px 0}.sub{font-size:11px;color:#9b9691;line-height:1.42}.internal{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.label{font-size:9px;color:#8c8782;margin:0 0 3px 2px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.fact,.step{background:var(--p2);border:1px solid var(--l);border-radius:13px;padding:12px}.fact h3,.step h3{font-size:9px;letter-spacing:.1em;color:#9b9690;margin:0 0 6px}.fact div,.step div{font-size:14px;line-height:1.38}.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.step div{font-weight:740}.warn{background:#211b0e;border-color:#5b4919}.sell{background:#2a1021;border-color:#69264f}.tele{background:var(--soft);color:#111;border-radius:18px;padding:17px;margin-top:9px}.tele small{font-weight:900;letter-spacing:.1em}.teleline{font-size:22px;font-weight:900;line-height:1.25;margin:7px 0 13px}.actions{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:6px}.actions button{background:#171719;color:#fff}.actions .pink{background:var(--pink)}.safe{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.yes,.no{border-radius:13px;padding:12px;font-size:12px;line-height:1.42}.yes{background:#102017;border:1px solid #285239}.no{background:#251313;border:1px solid #592727}.src{margin-top:8px;font-size:10px;color:#777}.src a{color:#f19ac8}.empty{text-align:center;padding:34px;color:#888}@media(max-width:850px){.layout,.hero,.facts,.steps,.safe{grid-template-columns:1fr}.search{grid-template-columns:1fr}.internal{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.list{max-height:220px}}</style></head><body><div class="app"><div class="top"><div class="brand">BELLEZA<b>BLITZ</b> • HOST COPILOT</div><div class="live">● LIVE READY</div></div><div class="search"><input id="q" placeholder="Busca producto o marca… Ej. Olaplex, COSRX, Charlotte Tilbury" oninput="filterList()"><button class="pink" onclick="go()">ABRIR FICHA</button></div><div class="layout"><aside class="card"><div class="cap">PRODUCTOS LISTOS · <span id="count"></span></div><div id="list" class="list"></div></aside><main id="main"><div class="card empty">Selecciona un producto. La ficha ya viene lista para vender.</div></main></div></div><script>

{id:'olaplex7',brand:'OLAPLEX',name:'Nº.7 Bonding Oil',cat:'Hair',size:'30 mL',retail:32,problem:'frizz, flyaways, falta de brillo y protección cuando se usa calor',what:'Aceite de styling concentrado y ligero para todo tipo de cabello.',benefits:'Aporta brillo y suavidad, ayuda a controlar frizz y flyaways y ofrece protección térmica hasta 450°F / 232°C.',ingredients:'Emoliente derivado de coco, vitamina E y aceite de semilla de girasol; la fórmula también incluye Bis-Aminopropyl Diglycol Dimaleate.',how:'Aplica 2–3 gotas en cabello húmedo o seco. Puede usarse antes del calor y después del styling para brillo y suavidad.',forwho:'Todo tipo de cabello; también cabello teñido o químicamente tratado.',objection:'“¿Me va a dejar grasoso?” → Es un aceite concentrado y ligero; la marca recomienda comenzar con solo 2–3 gotas.',cross:'Nº.6 Bond Smoother → Nº.7 Bonding Oil',source:'https://olaplex.com/collections/travel-sizes/products/olaplex-n-7-bonding-oil-30ml',hook:'¿Quién aquí se arregla el pelo y a los diez minutos ya tiene frizz o flyaways?'},
{id:'amika-wizard',brand:'amika',name:'The Wizard Detangling Primer',cat:'Hair',size:'5 oz / 150 mL',retail:32,problem:'enredos, frizz y preparación del cabello antes de secador o herramientas térmicas',what:'Mist primer todo-en-uno que desenreda y prepara el cabello antes del styling.',benefits:'Desenreda, suaviza, ayuda a reducir frizz, acorta el tiempo de blow-dry y protege del calor hasta 450°F.',ingredients:'La versión original se enfoca en una fórmula de priming y smoothing; si tienen la versión silicone-free, sus ingredientes destacados incluyen squalane y sea buckthorn. Verifica cuál versión tienes en mano.',how:'Rocía uniformemente sobre cabello húmedo de medios a puntas, desenreda y luego seca al aire o con blow-dry.',forwho:'Todo tipo de cabello, 1–4c.',objection:'“¿Sirve para mi tipo de pelo?” → La marca lo posiciona para todos los tipos de cabello 1–4c.',cross:'Shampoo + conditioner → The Wizard → styling oil/mask',source:'https://loveamika.com/products/the-wizard-detangling-primer',hook:'¿Quién pierde tiempo peleándose con el pelo mojado porque se enreda muchísimo?'},
{id:'cosrx-snail',brand:'COSRX',name:'Advanced Snail 96 Mucin Power Essence',cat:'Skincare',size:'3.38 fl oz / 100 mL',retail:25,problem:'resequedad, apariencia opaca, textura desigual y una barrera de piel que se siente estresada',what:'Esencia facial hidratante con 96.3% de filtrado de secreción de caracol.',benefits:'La marca la posiciona para hidratación profunda, una apariencia más suave y luminosa y apoyo a la barrera de la piel.',ingredients:'96.3% snail secretion filtrate, sodium hyaluronate, betaine, panthenol y allantoin.',how:'Después de limpiar y tonificar, aplica una pequeña cantidad en el rostro, da palmaditas y sigue con moisturizer.',forwho:'Todos los tipos de piel, incluida piel sensible según COSRX.',objection:'“¿Es una crema?” → No; es una esencia. Va antes del moisturizer.',cross:'Cleanser → toner → Snail Essence → Advanced Snail 92 Cream',source:'https://www.cosrx.com/products/advanced-snail-96-mucin-power-essence',hook:'¿Quién siente la piel tirante, opaca o con textura y quiere algo hidratante pero ligero?'},
{id:'benefit-pore',brand:'Benefit Cosmetics',name:'The POREfessional Face Primer',cat:'Makeup',size:'Full size / según empaque',retail:null,problem:'poros visibles, textura y maquillaje que no se aplica tan uniforme como quieres',what:'Primer facial alisador y difuminador para usar solo o debajo del maquillaje.',benefits:'Ayuda a suavizar visualmente la textura, minimizar la apariencia de poros y crear una base más uniforme para el maquillaje.',ingredients:'La ficha oficial destaca su fórmula cremosa-gel, ligera y no comedogénica. Para lista INCI completa, verifica el empaque exacto.',how:'Aplica una pequeña cantidad con las yemas de los dedos sobre el rostro, especialmente donde haya poros o textura visibles.',forwho:'Benefit lo indica para piel normal, seca, grasa, mixta y sensible.',objection:'“¿Tengo que usar foundation encima?” → No. También puede usarse solo para un acabado más suave.',cross:'Primer → foundation → setting powder / setting spray',source:'https://www.benefitcosmetics.com/en-us/product/the-porefessional-face-primer-FM04.html',hook:'¿A quién le pasa que se pone foundation y siente que los poros se ven todavía más?'},
{id:'ct-foundation',brand:'Charlotte Tilbury',name:'Beautiful Skin Foundation',cat:'Makeup',size:'30 mL',retail:52,problem:'piel que se ve apagada o cuando quieres cobertura sin perder un acabado saludable y radiante',what:'Foundation hidratante de cobertura media modulable y acabado natural-radiante.',benefits:'Cobertura media modulable, acabado radiante y fórmula con ingredientes de skincare que buscan que la piel se vea hidratada, más suave y luminosa.',ingredients:'Hyaluronic Acid, Rose Complex, Bix’Activ y Hyalurosmooth.',how:'Aplica sobre piel preparada y construye cobertura según necesidad. Asegúrate de mostrar el shade exacto durante el Live.',forwho:'Personas que buscan cobertura media modulable con acabado natural-radiante; el shade debe coincidir con tono y undertone.',objection:'“¿Es full coverage?” → Es medium buildable; puedes construir cobertura.',cross:'Foundation → Beautiful Skin Radiant Concealer → setting spray',source:'https://www.charlottetilbury.com/us/product/beautiful-skin-foundation-1-neutral',hook:'¿Quién quiere que la piel se vea arreglada pero no como una máscara pesada?'},
{id:'cerave-vitc',brand:'CeraVe',name:'Skin Renewing Vitamin C Serum',cat:'Skincare',size:'1 fl oz / según empaque',retail:28.99,problem:'apariencia opaca, tono desigual y una rutina que necesita un antioxidante',what:'Sérum facial con 10% vitamina C pura (L-ascorbic acid).',benefits:'Ayuda a iluminar visiblemente la tez y apoyar una apariencia suave, radiante y saludable.',ingredients:'10% L-ascorbic acid, tres ceramidas esenciales, hyaluronic acid y vitamina B5.',how:'Úsalo dentro de la rutina facial según instrucciones del empaque; durante el día completa con protector solar.',forwho:'Todos los tipos de piel; la marca también lo posiciona como apto para piel sensible.',objection:'“¿Tiene perfume?” → CeraVe indica que es free of added fragrance.',cross:'Cleanser → Vitamin C Serum → moisturizer → SPF',source:'https://www.cerave.com/skincare/facial-serums/skin-renewing-vitamin-c-serum',hook:'¿Quién siente que su piel está apagada y quiere meter vitamina C a la rutina sin complicarse?'},
{id:'caudalie-rich',brand:'Caudalie',name:'Premier Cru The Rich Cream',cat:'Skincare',size:'50 mL',retail:119,problem:'piel seca o muy seca que busca nutrición intensa y una rutina premium antiedad',what:'Moisturizer rico para piel seca a muy seca, enfocado en barrera, hidratación y signos visibles de envejecimiento.',benefits:'La marca la posiciona para nutrir, apoyar la barrera cutánea y mejorar visualmente arrugas, manchas y pérdida de volumen.',ingredients:'Micro Hyaluronic Acid, Caudalie Longevity Patent y bio-ceramides; también contiene ingredientes emolientes como grape seed oil y shea-derived components.',how:'Aplicar mañana y noche en rostro y cuello, sola o después del serum.',forwho:'Piel seca a muy seca; Caudalie también la indica para piel sensible.',objection:'“¿Es una crema ligera?” → No. Es la versión Rich, pensada para quien quiere más nutrición y confort.',cross:'Premier Cru Serum → Premier Cru Rich Cream → Eye Cream',source:'https://us.caudalie.com/p/459NAC/459nac-premier-cru-the-rich-cream.html',hook:'¿Quién tiene la piel seca y siente que una moisturizer normal simplemente no le alcanza?'},
{id:'briogeo-curl',brand:'Briogeo',name:'Curl Charisma Rice Amino + Avocado Hydrating & Defining Mask',cat:'Hair',size:'8 oz / 236 mL',retail:null,problem:'rizos u ondas que necesitan más hidratación, suavidad y definición sin sentirse demasiado pesados',what:'Mascarilla capilar ligera y nutritiva diseñada para curls y coils.',benefits:'La marca la presenta para acondicionar profundamente, hidratar y favorecer rizos más suaves, flexibles y definidos.',ingredients:'La línea destaca rice amino + avocado; verifica la lista INCI exacta del empaque si preguntan por alergias o ingredientes completos.',how:'Úsala como tratamiento de acondicionamiento según instrucciones del envase y luego enjuaga.',forwho:'Tipos de cabello rizado y con textura; Briogeo la posiciona para todos los tipos de curl.',objection:'“¿Me va a bajar el rizo?” → La marca la describe como lightweight y formulada para hidratar sin pesar el curl.',cross:'Curl shampoo → conditioner → Curl Charisma Mask → styling product',source:'https://shop.briogeohair.com/blogs/b-spoke/our-new-curl-charisma-hair-mask',hook:'¿Quién tiene curls que el día de wash day se ven lindos pero después sienten secos y sin definición?'}
];
const KEY='bb_live_internal_v4';let LIVE=JSON.parse(localStorage.getItem(KEY)||'{}');let shown=[...DB],cur=null,lines=[],idx=0;
const money=v=>v==null?'VERIFICAR':'$'+Number(v).toFixed(2);const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function renderList(){count.textContent=shown.length;list.innerHTML=shown.map(p=>`<div class="item" onclick="openP('${p.id}')"><b>${p.brand} · ${p.name}</b><span>${p.cat} · Retail ${money(p.retail)}</span></div>`).join('')}
function filterList(){let s=norm(q.value);shown=DB.filter(p=>!s||norm(p.brand+' '+p.name+' '+p.cat).includes(s));renderList()}
function go(){if(shown.length)openP(shown[0].id)}
function openP(id){cur=DB.find(p=>p.id===id);let x=LIVE[id]||{},ret=money(cur.retail),urg=x.qty?`Tenemos ${x.qty} confirmadas. Puedes usar esa cantidad como urgencia real.`:'Cantidad no confirmada: NO digas “último”, “quedan pocas” ni inventes escasez.',sell=x.price?`¡Vamos! ¿Quién me da ${x.price}?`:'Precio de inicio pendiente. Confírmalo antes de lanzar la subasta.';main.innerHTML=`<div class="hero"><div class="hl"><span class="tag">${cur.cat}</span><span class="tag">VERIFIED CORE</span><h1>${cur.brand}<br>${cur.name}</h1><div class="sub">${cur.size}</div><div class="internal"><div><div class="label">LIVE PRICE</div><input id="lp" placeholder="$___" value="${x.price||''}" onchange="saveLive()"></div><div><div class="label">QTY REAL</div><input id="lq" placeholder="Ej. 4" value="${x.qty||''}" onchange="saveLive()"></div><div><div class="label">CONDICIÓN</div><select id="lc" onchange="saveLive()"><option value="">Sin confirmar</option><option ${x.cond==='New / Sealed'?'selected':''}>New / Sealed</option><option ${x.cond==='New / Unboxed'?'selected':''}>New / Unboxed</option><option ${x.cond==='Box damage'?'selected':''}>Box damage</option><option ${x.cond==='Tester'?'selected':''}>Tester</option></select></div></div></div><div class="price"><small>RETAIL ACTUAL VERIFICADO</small><strong>${ret}</strong><div class="sub" style="color:#665f59">${cur.retail?'Fuente oficial de marca.':'Verifica antes de decirlo en Live.'}</div></div></div><div class="facts"><div class="fact"><h3>QUÉ ES</h3><div>${cur.what}</div></div><div class="fact"><h3>PROBLEMA / DESEO</h3><div>${cur.problem}</div></div><div class="fact"><h3>BENEFICIOS SEGUROS</h3><div>${cur.benefits}</div></div><div class="fact"><h3>INGREDIENTES / ACTIVOS CLAVE</h3><div>${cur.ingredients}</div></div><div class="fact"><h3>CÓMO SE USA</h3><div>${cur.how}</div></div><div class="fact"><h3>PARA QUIÉN</h3><div>${cur.forwho}</div></div><div class="fact"><h3>OBJECIÓN RÁPIDA</h3><div>${cur.objection}</div></div><div class="fact"><h3>CROSS-SELL</h3><div>${cur.cross}</div></div></div><div class="steps"><div class="step"><h3>1 · LLAMA LA ATENCIÓN</h3><div>¡Chicas, miren esto! ${cur.hook}</div></div><div class="step"><h3>2 · IDENTIFICA</h3><div>${cur.hook}</div></div><div class="step"><h3>3 · PRESENTA</h3><div>Este es ${cur.name} de ${cur.brand}. ${cur.what}</div></div><div class="step"><h3>4 · EDUCA</h3><div>${cur.benefits}</div></div><div class="step"><h3>5 · VALOR</h3><div>${cur.retail?'Retail oficial actual: '+ret+'.':'Retail pendiente: no lo inventes.'}</div></div><div class="step warn"><h3>6 · URGENCIA</h3><div>${urg}</div></div><div class="step sell"><h3>7 · VENDE</h3><div>${sell}</div></div><div class="step"><h3>TRANSICIÓN</h3><div>Si te llevaste esto, mira lo que tengo para combinarlo: ${cur.cross}.</div></div></div><div class="tele"><small>⚡ DI ESTO AHORA</small><div id="teleline" class="teleline"></div><div class="actions"><button class="pink" onclick="nextLine()">ME QUEDÉ EN BLANCO →</button><button onclick="mode('hook')">HOOK</button><button onclick="mode('educate')">EDUCA</button><button onclick="mode('reset')">RESET</button><button onclick="mode('close')">CLOSE</button></div></div><div class="safe"><div class="yes"><b>✓ SÍ</b><br>Usa datos verificados · menciona nombres · responde preguntas · mueve el Live · divulga condición · usa escasez solo si está confirmada.</div><div class="no"><b>✕ NO</b><br>No inventes ingredientes · no hagas promesas médicas · no mientas sobre retail/stock · no digas “último” sin confirmación.</div></div><div class="src">Fuente principal: <a href="${cur.source}" target="_blank">página oficial de ${cur.brand}</a></div>`;mode('hook')}
function saveLive(){if(!cur)return;LIVE[cur.id]={price:(document.getElementById('lp')?.value||'').trim(),qty:(document.getElementById('lq')?.value||'').trim(),cond:(document.getElementById('lc')?.value||'')};localStorage.setItem(KEY,JSON.stringify(LIVE))}
function sets(m){let x=LIVE[cur.id]||{},ret=cur.retail?money(cur.retail):null;return {hook:[`¡Chicas, miren esto! ${cur.hook}`,`Este es ${cur.name} de ${cur.brand}.`,`Si tú estás lidiando con ${cur.problem}, presta atención a este.`],educate:[cur.benefits,`Ingredientes clave: ${cur.ingredients}`,`Cómo se usa: ${cur.how}`,`Ideal para: ${cur.forwho}`],reset:[`Para las chicas que acaban de entrar, ¡bienvenidas! Somos BellezaBlitz Live y las beauty deals se mueven rápido.`,`Acabamos de sacar ${cur.name} de ${cur.brand}.`,`Si acabas de entrar: ${cur.what}`],close:[x.price?`¡Vamos! ¿Quién me da ${x.price}?`:'Confirma el precio de inicio antes de lanzar.',ret?`Retail oficial ${ret}. Miren dónde va la subasta.`:'No tengo retail verificado, así que no lo voy a inventar.',x.qty?`Tenemos ${x.qty} confirmadas. ¡Vamos arriba!`:'Cantidad no confirmada: vende sin falsa escasez.',`Si te llevaste esto, el próximo complemento lógico es: ${cur.cross}.`]}[m]}
function mode(m){lines=sets(m);idx=0;teleline.textContent=lines[0]}
function nextLine(){idx=(idx+1)%lines.length;teleline.textContent=lines[idx]}
renderList();</script></body></html>
