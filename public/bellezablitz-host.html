<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>BellezaBlitz Host Copilot</title><style>body{font-family:system-ui,-apple-system;background:#0b0b0c;color:#fff;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.card{background:#151517;border:1px solid #2d2d31;border-radius:18px;padding:18px;margin-bottom:14px}input,button{font:inherit;border-radius:12px;padding:13px}input{width:100%;box-sizing:border-box;background:#0d0d0f;color:#fff;border:1px solid #333}button{border:0;background:#ff3da8;color:white;font-weight:800;margin-top:10px;width:100%}.muted{color:#aaa}.result{margin-top:16px}.pill{display:inline-block;background:#301326;color:#ffb8dd;border-radius:999px;padding:5px 9px;font-size:12px}.big{font-size:28px;font-weight:850;line-height:1.1}.line{font-size:22px;font-weight:800;background:#ffd2e8;color:#111;padding:18px;border-radius:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:#1b1b1e;border:1px solid #2b2b2f;padding:14px;border-radius:14px}.mini b{display:block;font-size:12px;color:#aaa;margin-bottom:6px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class='wrap'><div class='card'><span class='pill'>BELLEZABLITZ LIVE</span><h1>Host Copilot</h1><p class='muted'>Escribe un producto. Si está en la base, abre la guía; si no, crea una ficha rápida para usar durante el Live.</p><input id='q' placeholder='Ej. Olaplex No. 7 Bonding Oil'><button onclick='investigar()'>INVESTIGAR</button></div><div id='out'></div></div><script>
const DB=[
{brand:'Amika',name:'The Wizard Detangling Primer',cat:'Hair',retail:'$28',problem:'frizz, enredos y preparación antes del styling',educate:'Primer desenredante para integrar antes del styling; verifica claims específicos en el empaque.',cross:'Shampoo → conditioner → treatment → styling'},
{brand:'COSRX',name:'Advanced Snail 96 Mucin Power Essence',cat:'Skincare',retail:'Verificar',problem:'rutina de hidratación y apariencia de la piel',educate:'Esencia de skincare; explica uso y beneficios cosméticos sin claims médicos.',cross:'Cleanser → toner → essence/serum → moisturizer'},
{brand:'Charlotte Tilbury',name:'Beautiful Skin Foundation',cat:'Makeup',retail:'$52',problem:'unificar el look y crear una base de maquillaje',educate:'Habla de acabado, cobertura y tono; demuestra visualmente cuando sea posible.',cross:'Foundation → concealer → setting spray'}];
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function ficha(p){const q=p.name;const question=p.cat==='Hair'?'¿Quién aquí siente el cabello seco, con frizz o usa calor?':p.cat==='Makeup'?'¿Quién está armando un look natural o glam?':'¿Quién está buscando mejorar su rutina de skincare?';out.innerHTML=`<div class='card result'><div class='big'>${p.brand}<br>${p.name}</div><p class='muted'>${p.cat} · Retail ${p.retail}</p><div class='grid'><div class='mini'><b>1 · LLAMA LA ATENCIÓN</b>¡Chicas, miren esto! Tengo ${q} de ${p.brand}.</div><div class='mini'><b>2 · IDENTIFICA</b>${question}</div><div class='mini'><b>3 · PRESENTA</b>Este es ${q} de ${p.brand}.</div><div class='mini'><b>4 · EDUCA</b>${p.educate}</div><div class='mini'><b>5 · VALOR</b>${p.retail==='Verificar'?'Retail pendiente. No lo inventes.':'Retail publicado: '+p.retail+'.'}</div><div class='mini'><b>6 · URGENCIA</b>Solo usa cantidad/escasez si BeautyBlitz la confirma.</div><div class='mini'><b>7 · VENDE</b>Confirma precio de inicio: “¡Vamos! ¿Quién me da $___?”</div><div class='mini'><b>CROSS-SELL</b>${p.cross}</div></div><h3>DI ESTO AHORA</h3><div class='line'>¡Chicas, miren esto! Tengo ${q} de ${p.brand}. ${question}</div></div>`}
function investigar(){const query=document.getElementById('q').value.trim();if(!query)return;let p=DB.find(x=>norm(query).includes(norm(x.name))||norm(x.name).includes(norm(query))||norm(query).includes(norm(x.brand)));if(!p){const words=query.split(' ');p={brand:words.slice(0,2).join(' '),name:query,cat:/oil|shampoo|hair|mask|conditioner/i.test(query)?'Hair':/serum|cream|cleanser|toner|skin/i.test(query)?'Skincare':/foundation|lip|mascara|blush|makeup/i.test(query)?'Makeup':'Beauty',retail:'Verificar',problem:'el problema o deseo relacionado con este producto',educate:'Producto nuevo: verifica primero marca, ingredientes, uso, retail y claims antes de describir beneficios.',cross:'Busca un complemento lógico de la misma rutina'};ficha(p);out.innerHTML+=`<div class='card'><b>Producto nuevo</b><p class='muted'>Todavía no está investigado en la base. Esta versión web ya funciona como app; el siguiente paso es conectar investigación automática real desde servidor para completar retail, ingredientes y fuentes.</p></div>`;return}ficha(p)}
</script></body></html>
