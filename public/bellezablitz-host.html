<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BellezaBlitz Host Copilot</title><style>:root{--bg:#fffaf8;--ink:#30282b;--muted:#8d7e84;--rose:#e96d9d;--pink:#ffdbe8;--cream:#f8eee8;--line:#eadde2;--green:#eaf8ef;--yellow:#fff6d7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffaf8,#fff 58%,#fff8fb);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}.app{max-width:920px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.logo{font-size:13px;font-weight:900;letter-spacing:.08em}.logo b{color:var(--rose)}.live{font-size:10px;padding:7px 10px;border-radius:999px;background:#fff0f5;color:#a64b70;border:1px solid #f1bfd2}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#b35b7b;font-weight:850}.search h1{font-size:31px;line-height:1.05;margin:6px 0}.search p{color:var(--muted);margin:0 0 14px}.searchbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 12px 32px rgba(118,71,89,.07)}.row{display:grid;grid-template-columns:1fr 145px;gap:8px}.row input,.quick,.livefields input{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;color:var(--ink)}.primary{border:0;border-radius:13px;background:var(--rose);color:#fff;padding:12px 14px;font-weight:850;cursor:pointer}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;max-height:66vh;overflow:auto}.item{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px;cursor:pointer}.item b{display:block;font-size:13px}.item span{font-size:10px;color:var(--muted)}#productView{display:none}.productTop{position:sticky;top:0;z-index:30;display:flex;gap:8px;padding:7px 0 9px;background:rgba(255,250,248,.96);backdrop-filter:blur(12px)}.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 12px;font-weight:850;color:var(--ink)}.quick{flex:1;border-radius:999px}.hero{background:#fff;border:1px solid var(--line);border-radius:23px;padding:16px;box-shadow:0 12px 32px rgba(118,71,89,.07)}.hero h1{font-size:29px;line-height:1.03;margin:6px 0}.meta{font-size:11px;color:var(--muted)}.retail{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.retailbox{border-radius:17px;padding:14px;background:var(--cream)}.retailbox.liveprice{background:#fff3f8}.retailbox small{display:block;font-size:9px;font-weight:900;letter-spacing:.08em;color:#9c6377}.retailbox strong{display:block;font-size:28px;line-height:1.05;margin:4px 0}.retailbox span{font-size:10px;color:var(--muted)}.say{background:var(--pink);border-radius:18px;padding:15px;margin-top:9px}.say small{font-size:10px;font-weight:900;letter-spacing:.08em;color:#974b69}.sayText{font-size:22px;font-weight:900;line-height:1.18;margin-top:6px;min-height:52px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.buttons button{border:0;border-radius:12px;padding:11px 8px;background:#f7eef2;color:var(--ink);font-size:11px;font-weight:850;cursor:pointer}.buttons .panic{grid-column:span 2;background:var(--rose);color:#fff}.buttons .auth{background:#edf8f1}.essentials{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.box b{display:block;font-size:10px;text-transform:uppercase;color:#a85c78;margin-bottom:5px}.box div{font-size:14px;line-height:1.4}.close{background:var(--yellow)}.livefields{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.livefields label{display:block;font-size:9px;color:var(--muted);margin:0 0 3px 2px}.save{width:100%;margin-top:7px}.hint{margin-top:9px;padding:10px 12px;border-radius:14px;background:var(--green);font-size:12px}.more{margin-top:9px}.more details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.more summary{font-weight:850;cursor:pointer;color:#8e5870}.tech{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.source{font-size:9px;color:#a69a9e;margin:9px 3px 60px}.source a{color:#b44e76}@media(max-width:720px){.app{padding:9px}.search h1,.hero h1{font-size:25px}.row,.list,.retail,.essentials,.livefields,.tech{grid-template-columns:1fr}.sayText{font-size:19px}.buttons{grid-template-columns:1fr 1fr}.buttons .panic{grid-column:1/-1}}</style></head><body><div class="app"><div class="top"><div class="logo">BELLEZA<b>BLITZ</b> • HOST COPILOT</div><div class="live">● LIVE READY</div></div><section id="searchView" class="search"><div class="eyebrow">Tu apoyo durante el Live 💕</div><h1>Busca el producto.<br>Y dime qué vender.</h1><p>La host ve lo importante. Nada de paredes de texto.</p><div class="searchbox"><div class="row"><input id="q" placeholder="Fekkai, Tatcha, lip gloss..."><button class="primary" data-action="open-first">VER PRODUCTO</button></div><div id="list" class="list"></div></div></section><section id="productView"><div class="productTop"><button class="back" data-action="back">← Otro producto</button><input id="quickSearch" class="quick" placeholder="Busca otro aquí..."></div><div id="productContent"></div></section></div><script>let DB=[],shown=[],cur=null,blankIndex=0;const INTERNAL=JSON.parse(localStorage.getItem('bb_live_data')||'{}');const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const el=id=>document.getElementById(id);Promise.all(['/bellezablitz-products.json','/bellezablitz-products-wave2.json','/bellezablitz-products-wave3.json'].map(u=>fetch(u).then(r=>r.json()))).then(parts=>{const m=new Map();parts.flat().forEach(p=>m.set(p.id,p));DB=[...m.values()];shown=DB;renderList()}).catch(()=>el('list').innerHTML='<div class="item"><b>No pude cargar la base.</b><span>Recarga la página 💕</span></div>');function renderList(){el('list').innerHTML=shown.map(p=>`<div class="item" data-product="${p.id}"><b>${p.brand} · ${p.name}</b><span>${p.cat} · ${p.status||''}</span></div>`).join('')||'<div class="item"><b>No encontré coincidencias.</b><span>Prueba con marca o una palabra del producto.</span></div>'}function filterList(){const x=norm(el('q').value);shown=DB.filter(p=>norm(`${p.brand} ${p.name} ${p.cat} ${p.problem||''}`).includes(x));renderList()}function openProduct(id){cur=DB.find(p=>p.id===id);if(!cur)return;el('searchView').style.display='none';el('productView').style.display='block';window.scrollTo({top:0});blankIndex=0;const x=INTERNAL[id]||{};const retail=cur.retailRef||'VERIFICAR';const retailSafe=/verificar|mini/i.test(retail)?retail:`${retail}`;const live=x.price||'—';el('productContent').innerHTML=`<div class="hero"><div class="eyebrow">${cur.cat} · ${cur.status||'Ready'}</div><h1>${cur.brand}<br>${cur.name}</h1><div class="meta">${cur.size||''} · Goodbye Inventory ${cur.gbiPrice||'verificar'}</div><div class="retail"><div class="retailbox"><small>RETAIL ORIGINAL</small><strong>${retailSafe}</strong><span>Este es el precio de comparación. Si dice “verificar”, NO inventes cifra.</span></div><div class="retailbox liveprice"><small>PRECIO DEL LIVE</small><strong>${live}</strong><span>${x.price?'Ya guardado para este Live':'Agrégalo abajo cuando lo confirmen'}</span></div></div><div class="say"><small>⚡ DI ESTO AHORA</small><div id="sayText" class="sayText">${cur.hook}</div></div><div class="buttons"><button class="panic" data-action="blank">ME QUEDÉ EN BLANCO →</button><button data-mode="hook">OTRO HOOK</button><button data-mode="educa">QUÉ CUENTO</button><button data-mode="reset">NUEVA GENTE</button><button data-mode="close">CERRAR</button><button class="auth" data-mode="auth">¿SON FAKE?</button></div><div class="essentials"><div class="box"><b>Qué estás vendiendo</b><div>${cur.what}</div></div><div class="box"><b>Problema / deseo</b><div>${cur.problem}</div></div><div class="box"><b>3 puntos que importan</b><div>${cur.benefits}</div></div><div class="box"><b>Si me preguntan</b><div>${cur.objection}</div></div><div class="box"><b>Cómo se usa</b><div>${cur.how}</div></div><div class="box"><b>Cross-sell</b><div>${cur.cross}</div></div><div class="box close"><b>Cierre rápido</b><div>${x.price?`“Ok chicas, retail ${retailSafe}, aquí vamos en ${x.price}. ¿Quién se lo lleva?”`:'“Déjenme confirmar el precio del Live y se los lanzo.”'}</div></div><div class="box"><b>Autenticidad</b><div>Goodbye Inventory declara que sus productos son 100% auténticos y vienen de retailers autorizados, marcas y canales oficiales.</div></div></div><div class="livefields"><div><label>PRECIO LIVE</label><input id="lp" value="${x.price||''}" placeholder="$12"></div><div><label>CANTIDAD</label><input id="lq" value="${x.qty||''}" placeholder="4"></div><div><label>CONDICIÓN</label><input id="lc" value="${x.cond||''}" placeholder="sealed / open box"></div></div><button class="primary save" data-action="save">GUARDAR PARA ESTE LIVE</button><div class="hint">💕 Flow: problema → 2 beneficios → retail original → precio del Live → “¿quién se lo lleva?”</div></div><div class="more"><details><summary>Ver info técnica</summary><div class="tech"><div class="box"><b>Para quién</b><div>${cur.forwho}</div></div><div class="box"><b>Ingredientes / activos</b><div>${cur.ingredients}</div></div></div></details></div><div class="source">Fuente producto: <a href="${cur.source}" target="_blank">oficial</a>. Autenticidad: política pública de Goodbye Inventory. No inventes precio, stock ni condición.</div>`}function say(text){const node=el('sayText');if(node){node.textContent=text;node.scrollIntoView({behavior:'smooth',block:'center'})}}function mode(m){if(!cur)return;const x=INTERNAL[cur.id]||{};const retail=cur.retailRef||'VERIFICAR';const map={hook:[cur.hook,`Chicas, si ${cur.problem}, miren esto porque les puede interesar.`,`A ver, ¿quién aquí usaría ${cur.name} en su rutina?`],educa:[`Lo importante: ${cur.benefits}`,`Se usa así: ${cur.how}`,`Este producto es para: ${cur.forwho}`],reset:[`Para las que acaban de entrar, bienvenidas 💕 Estamos con ${cur.name} de ${cur.brand}.`,`Si acabas de llegar: retail ${retail}. Les cuento rápido qué hace.`,`Chicas nuevas, quédense porque los deals se mueven rápido.`],close:[x.price?`Retail ${retail}; aquí vamos en ${x.price}. ¿Quién se lo lleva?`:`Déjenme confirmar el precio del Live antes de lanzarlo.`,x.qty?`Tenemos ${x.qty} confirmadas. Si te gustó, este es el momento.`:`No les voy a inventar cantidad. Déjenme verificar stock.`,`Si te llevaste esto, mira con qué lo combino: ${cur.cross}.`],auth:[`No. Goodbye Inventory indica que todos sus productos son 100% auténticos y vienen de retailers autorizados, marcas y canales oficiales.`,`Estos son productos auténticos de liquidation, overstock y closeout; por eso el precio puede ser mucho menor que retail.`,`El empaque o la condición puede variar según el lote, pero Goodbye Inventory dice que no vende counterfeit, imitation ni replicas.`]};const arr=map[m]||[];if(arr.length)say(arr[Math.floor(Math.random()*arr.length)])}function blank(){if(!cur)return;const x=INTERNAL[cur.id]||{};const retail=cur.retailRef||'VERIFICAR';const pool=[cur.hook,`Este es ${cur.name} de ${cur.brand}. Lo importante es: ${cur.benefits}`,`¿A quién le pasa esto? Las leo en el chat.`,`Se usa así: ${cur.how}`,`Retail original ${retail}. Aquí es donde está el deal.`,`Si te gustó, mira con qué lo combino: ${cur.cross}.`];if(x.price)pool.push(`Retail ${retail}, aquí vamos en ${x.price}. ¿Quién se lo lleva?`);blankIndex=(blankIndex+1)%pool.length;say(pool[blankIndex])}function save(){if(!cur)return;INTERNAL[cur.id]={price:el('lp').value.trim(),qty:el('lq').value.trim(),cond:el('lc').value.trim()};localStorage.setItem('bb_live_data',JSON.stringify(INTERNAL));openProduct(cur.id)}document.addEventListener('input',e=>{if(e.target.id==='q')filterList()});document.addEventListener('keydown',e=>{if(e.target.id==='quickSearch'&&e.key==='Enter'){const x=norm(e.target.value);const p=DB.find(p=>norm(`${p.brand} ${p.name}`).includes(x));if(p){e.target.value='';openProduct(p.id)}}});document.addEventListener('click',e=>{const product=e.target.closest('[data-product]');if(product){openProduct(product.dataset.product);return}const btn=e.target.closest('button');if(!btn)return;const a=btn.dataset.action,m=btn.dataset.mode;if(a==='open-first'&&shown[0])openProduct(shown[0].id);else if(a==='back'){el('productView').style.display='none';el('searchView').style.display='block';el('q').value='';shown=DB;renderList();window.scrollTo({top:0})}else if(a==='blank')blank();else if(a==='save')save();else if(m)mode(m)});</script></body></html>
