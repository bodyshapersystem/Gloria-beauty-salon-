<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BellezaBlitz Host Copilot</title><style>:root{--bg:#0b0b0c;--p:#161618;--p2:#1e1e21;--l:#2e2e33;--t:#faf8f5;--m:#aaa49f;--pink:#ff4fad;--soft:#ffd8ea;--cream:#f3ece4;--gold:#ffe9a5;--green:#c7f6d5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,-apple-system,sans-serif}.app{max-width:1450px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:13px;font-weight:900;letter-spacing:.12em}.brand b{color:var(--pink)}.live{font-size:10px;border:1px solid #7b2c58;background:#2a1021;color:#ffc9e4;border-radius:999px;padding:7px 10px}.hello{background:linear-gradient(145deg,#20151c,#151517);border:1px solid #49303f;border-radius:16px;padding:13px 14px;margin-bottom:10px}.hello b{display:block;margin-bottom:4px}.hello span{font-size:12px;color:#c9c2bd}.search{display:grid;grid-template-columns:1fr 140px;gap:8px;background:var(--p);border:1px solid var(--l);padding:11px;border-radius:16px;margin-bottom:11px}input{width:100%;background:#0f0f11;color:#fff;border:1px solid var(--l);border-radius:11px;padding:11px;font:inherit}button{border:0;border-radius:11px;padding:11px;font-weight:800;cursor:pointer}.pink{background:var(--pink);color:#fff}.layout{display:grid;grid-template-columns:325px 1fr;gap:11px}.card{background:var(--p);border:1px solid var(--l);border-radius:17px;padding:14px}.cap{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--m);margin-bottom:9px}.list{display:flex;flex-direction:column;gap:6px;max-height:78vh;overflow:auto}.item{background:#0f0f11;border:1px solid var(--l);border-radius:11px;padding:9px;cursor:pointer}.item:hover{border-color:#743154}.item b{display:block;font-size:12px}.item span{font-size:10px;color:#8e8984}.hero{display:grid;grid-template-columns:1fr 280px;gap:9px}.hl{background:linear-gradient(145deg,#2a1021,#121214);border:1px solid #622649;border-radius:17px;padding:17px}.tag{display:inline-block;background:#35132a;color:#ffb8dd;border-radius:999px;padding:5px 8px;font-size:10px;margin-right:5px}.hl h1{font-size:27px;line-height:1.08;margin:9px 0 5px}.price{background:var(--cream);color:#111;border-radius:17px;padding:17px}.price small{font-size:10px;color:#6d655e;letter-spacing:.1em}.price strong{display:block;font-size:30px;margin:3px 0}.sub{font-size:11px;color:#9c9792;line-height:1.42}.internal{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.label{font-size:9px;color:#8d8882;margin:0 0 3px 2px}.facts,.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.fact,.step{background:var(--p2);border:1px solid var(--l);border-radius:13px;padding:12px}.fact h3,.step h3{font-size:9px;letter-spacing:.1em;color:#9d9791;margin:0 0 6px}.fact div,.step div{font-size:14px;line-height:1.38}.step div{font-weight:740}.warn{background:#211b0e;border-color:#5d4b1a}.sell{background:#2b1021;border-color:#6d2851}.tele{background:var(--soft);color:#111;border-radius:18px;padding:17px;margin-top:9px}.tele small{font-weight:900;letter-spacing:.1em}.teleline{font-size:22px;font-weight:900;line-height:1.25;margin:7px 0 13px}.actions{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:6px}.actions button{background:#171719;color:#fff}.actions .pink{background:var(--pink)}.source{margin-top:9px;font-size:10px;color:#7f7a75}.source a{color:#f09ac7}.empty{text-align:center;padding:38px;color:#888}.badge{background:#33270e;color:#ffecaa;border:1px solid #735d22;padding:6px 9px;border-radius:999px;font-size:10px}.tip{background:#102018;border:1px solid #2e5d3f;color:#d9f7e3;border-radius:12px;padding:10px 12px;margin-top:9px;font-size:12px}.friendly{font-size:12px;color:#c7c0bb;margin-top:5px}@media(max-width:850px){.layout,.hero,.facts,.steps{grid-template-columns:1fr}.search{grid-template-columns:1fr}.internal{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.list{max-height:245px}}</style></head><body><div class="app"><div class="top"><div class="brand">BELLEZA<b>BLITZ</b> • HOST COPILOT</div><div class="live">● READY TO SELL</div></div><div class="hello"><b>Tu apoyo durante el Live 💕</b><span>Busca el producto y te digo qué contar, cómo venderlo y qué decir si te quedas en blanco. Tú pones la energía; yo te ayudo con la info.</span></div><div class="search"><input id="q" placeholder="Busca por nombre, marca o tipo… Ej. Tatcha, lip gloss, hair mask" oninput="filterList()"><button class="pink" onclick="openFirst()">VER PRODUCTO</button></div><div class="layout"><aside class="card"><div class="cap">PRODUCTOS LISTOS · <span id="count"></span></div><div id="list" class="list"></div></aside><main id="main"><div class="card empty">Elige un producto y te preparo todo para venderlo ✨</div></main></div></div><script>let DB=[],shown=[],cur=null,lines=[],li=0;const INTERNAL=JSON.parse(localStorage.getItem('bb_live_data')||'{}');const n=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');fetch('/bellezablitz-products.json').then(r=>r.json()).then(d=>{DB=d;shown=d;renderList();if(d[0])openP(d[0].id)}).catch(()=>main.innerHTML='<div class="card empty">No pude cargar la base. Recarga la página 💕</div>');function renderList(){count.textContent=shown.length+' productos';list.innerHTML=shown.map(p=>`<div class="item" onclick="openP('${p.id}')"><b>${p.brand} · ${p.name}</b><span>${p.cat} · ${p.status} · GBI ${p.gbiPrice}</span></div>`).join('')||'<div class="empty">No encontré coincidencias. Prueba con la marca o una palabra del producto.</div>'}function filterList(){let x=n(q.value);shown=DB.filter(p=>n(p.brand+' '+p.name+' '+p.cat+' '+p.problem).includes(x));renderList()}function openFirst(){if(shown[0])openP(shown[0].id)}function openP(id){cur=DB.find(p=>p.id===id);if(!cur)return;let x=INTERNAL[id]||{};main.innerHTML=`<div class="hero"><div class="hl"><span class="tag">${cur.cat}</span><span class="tag">${cur.status}</span><span class="badge">BEST SELLER</span><h1>${cur.brand}<br>${cur.name}</h1><div class="sub">${cur.size} · Goodbye Inventory ${cur.gbiPrice} · Retail ref ${cur.retailRef}</div><div class="friendly">💡 Yo ya investigué la parte pública. Aquí solo completas lo que cambia en ese Live.</div><div class="internal"><div><div class="label">PRECIO DEL LIVE</div><input id="lp" value="${x.price||''}" placeholder="Ej. $12"></div><div><div class="label">CUÁNTOS HAY</div><input id="lq" value="${x.qty||''}" placeholder="Ej. 4"></div><div><div class="label">CONDICIÓN</div><input id="lc" value="${x.cond||''}" placeholder="sealed / unboxed"></div></div><button class="pink" style="margin-top:7px" onclick="saveLive()">GUARDAR PARA ESTE LIVE</button></div><div class="price"><small>PRECIO DE REFERENCIA</small><strong>${cur.retailRef}</strong><div class="sub" style="color:#6d655e">GBI: ${cur.gbiPrice}<br>${cur.status}<br><br>No asumir que este es el precio de subasta.</div></div></div><div class="facts"><div class="fact"><h3>¿QUÉ ES?</h3><div>${cur.what}</div></div><div class="fact"><h3>¿QUÉ PROBLEMA VENDEMOS?</h3><div>${cur.problem}</div></div><div class="fact"><h3>¿POR QUÉ LE PUEDE GUSTAR?</h3><div>${cur.benefits}</div></div><div class="fact"><h3>INGREDIENTES / ACTIVOS CLAVE</h3><div>${cur.ingredients}</div></div><div class="fact"><h3>¿CÓMO SE USA?</h3><div>${cur.how}</div></div><div class="fact"><h3>¿PARA QUIÉN ES?</h3><div>${cur.forwho}</div></div><div class="fact"><h3>SI ME PREGUNTAN…</h3><div>${cur.objection}</div></div><div class="fact"><h3>QUÉ LE COMBINA</h3><div>${cur.cross}</div></div></div><div class="tip">✨ Tip: no tienes que decir todo. Elige 2–3 cosas, haz una pregunta y sigue moviendo el Live.</div><div class="steps"><div class="step"><h3>1 · ENTRA CON ALGO NATURAL</h3><div>${cur.hook}</div></div><div class="step"><h3>2 · MÉTELAS EN LA CONVERSACIÓN</h3><div>“¿A quién le pasa esto? Cuéntenme en el chat.”</div></div><div class="step"><h3>3 · DI QUÉ ES</h3><div>“Este es ${cur.name} de ${cur.brand}.”</div></div><div class="step"><h3>4 · CUENTA LO MÁS IMPORTANTE</h3><div>${cur.benefits}</div></div><div class="step"><h3>5 · HABLA DEL VALOR</h3><div>“De referencia está en ${cur.retailRef}. Aquí lo estamos moviendo diferente.”</div></div><div class="step warn"><h3>6 · CREA URGENCIA SOLO SI ES REAL</h3><div>${x.qty?`“Chicas, tenemos ${x.qty} confirmadas.”`:'Todavía no hay cantidad confirmada. No inventes escasez.'}</div></div><div class="step sell"><h3>7 · CIERRA</h3><div>${x.price?`“Ok chicas, vamos en ${x.price}. ¿Quién se lo lleva?”`:'Confirma el precio de inicio antes de lanzar.'}</div></div><div class="step"><h3>Y SI QUIERES SUBIR EL TICKET…</h3><div>“Si te llevaste esto, mira lo que combina: ${cur.cross}.”</div></div></div><div class="tele"><small>⚡ DIME QUÉ DECIR AHORA</small><div id="teleline" class="teleline">${cur.hook}</div><div class="actions"><button class="pink" onclick="nextLine()">ME QUEDÉ EN BLANCO →</button><button onclick="mode('hook')">OTRO HOOK</button><button onclick="mode('educa')">QUÉ CUENTO</button><button onclick="mode('reset')">NUEVA GENTE</button><button onclick="mode('close')">CERRAR</button></div></div><div class="source">Fuente del producto: <a href="${cur.source}" target="_blank">ver fuente oficial</a> · Ranking/precio/stock público: Goodbye Inventory. Claims médicos no permitidos.</div>`;mode('hook',false)}function saveLive(){INTERNAL[cur.id]={price:lp.value.trim(),qty:lq.value.trim(),cond:lc.value.trim()};localStorage.setItem('bb_live_data',JSON.stringify(INTERNAL));openP(cur.id)}function getLines(m){let x=INTERNAL[cur.id]||{};return{hook:[cur.hook,`“Chicas, si esto les pasa, miren ${cur.name} de ${cur.brand}.”`,`“A ver, ¿quién aquí usaría esto en su rutina?”`],educa:[`“Básicamente, esto es ${cur.what.toLowerCase()}”`,cur.benefits,`“Lo importante aquí: ${cur.ingredients}”`,`“Y se usa así: ${cur.how}”`],reset:[`“Para las chicas que acaban de entrar, bienvenidas 💕 Estamos haciendo beauty deals en vivo y todo se mueve rápido.”`,`“Ahora mismo estamos con ${cur.name} de ${cur.brand}.”`,`“Si acabas de llegar, quédate porque ya vamos con el próximo.”`],close:[x.price?`“Ok chicas, vamos en ${x.price}. ¿Quién se lo lleva?”`:'Confirma el precio antes de vender.',x.qty?`“Tenemos ${x.qty} confirmadas, así que si te gustó, no te duermas.”`:'No hay cantidad confirmada. Cierra sin falsa escasez.',`“Y si te llevaste esto, mira lo que combina: ${cur.cross}.”`]}[m]}function mode(m,show=true){lines=getLines(m);li=0;if(show)teleline.textContent=lines[0]}function nextLine(){li=(li+1)%lines.length;teleline.textContent=lines[li]}</script></body></html>
