<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BellezaBlitz Host Copilot</title><style>:root{--ink:#302229;--muted:#8b7980;--rose:#e74d83;--berry:#a51f53;--pink:#ffdce8;--line:#efdee4;--cream:#f8eee8;--green:#edf8f1;--shadow:0 18px 48px #7c345016}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff7fa,#fff);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{max-width:960px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;padding:7px 2px 14px}.brand{text-align:center}.brand strong{font-family:Georgia,serif;font-size:18px;letter-spacing:.12em}.brand span{display:block;font-size:10px;color:var(--muted);margin-top:4px}.crown{font-size:22px;color:var(--berry)}.live{font-size:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 10px}.searchHero{position:relative;overflow:hidden;padding:24px 20px;border:1px solid #f4dbe5;border-radius:30px;background:linear-gradient(135deg,#fff,#fff1f6 58%,#ffe2ec);box-shadow:var(--shadow)}.hello{color:#b33563;font-weight:800}.searchHero h1{font:500 46px/.98 Georgia,serif;letter-spacing:-.045em;margin:9px 0}.searchHero p{max-width:620px;color:var(--muted);line-height:1.5}.panel{margin-top:14px;padding:14px;background:#fffffff2;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}.searchWrap{position:relative}.searchWrap:before{content:'⌕';position:absolute;left:17px;top:9px;font-size:24px;color:#8f7a82}.searchWrap input,.quick,.livefields input{width:100%;border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff;outline:none}.searchWrap input{padding-left:47px;font-size:15px}.cats{display:flex;gap:8px;overflow:auto;padding:12px 0 4px}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;font-size:11px}.cat.active{background:linear-gradient(135deg,#ef5d90,#cf2f67);color:white;border-color:transparent}.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:17px 3px 9px}.sectionTitle b{font:600 20px Georgia,serif}.sectionTitle span{font-size:10px;color:var(--muted)}.list{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:58vh;overflow:auto}.item{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:0 8px 24px #6e3f500d;cursor:pointer}.item:after{content:'';position:absolute;width:90px;height:90px;right:-28px;top:-28px;border-radius:50%;background:linear-gradient(135deg,#fff4f7,#ffdfe9)}.itemTop{position:relative;z-index:1;display:flex;justify-content:space-between}.brandName{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#b85d7e;font-weight:900}.item b{display:block;margin-top:4px;font:600 17px/1.15 Georgia,serif;max-width:85%}.arrow{z-index:2;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#fff0f5;color:var(--berry)}.tags{position:relative;z-index:1;display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{font-size:9px;padding:5px 7px;border-radius:999px;background:#faf2f5;color:#765f68}.stock{background:var(--green)}.retailtag{background:#fff3df}.empty{grid-column:1/-1;text-align:center;padding:30px;color:var(--muted)}#productView{display:none}.productTop{position:sticky;top:0;z-index:20;display:flex;gap:8px;padding:7px 0 10px;background:#fff8faee;backdrop-filter:blur(14px)}.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;font-weight:850}.quick{flex:1;border-radius:999px;padding:10px 14px}.hero{background:#fff;border:1px solid var(--line);border-radius:30px;padding:18px;box-shadow:var(--shadow)}.productHead{display:grid;grid-template-columns:135px 1fr;gap:16px;align-items:center}.visual{height:135px;border-radius:24px;background:radial-gradient(circle at 50% 30%,#fff,#ffe7ef 45%,#f2c8d7);display:grid;place-items:center;font-size:56px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#a34b6b;font-weight:900}.hero h1{font:600 31px/1.02 Georgia,serif;margin:6px 0}.meta{font-size:11px;color:var(--muted);line-height:1.45}.prices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.price{border-radius:18px;padding:13px;background:var(--cream)}.price.liveprice{background:#ffe8f0}.price small{font-size:9px;font-weight:900;color:#985a71}.price strong{display:block;font:600 29px Georgia,serif;margin:3px 0}.price span{font-size:10px;color:var(--muted)}.say{position:relative;overflow:hidden;margin-top:11px;padding:18px;background:linear-gradient(135deg,#ffdce8,#ffeef3);border-radius:24px}.say small{font-size:10px;font-weight:900;color:#9c3b62}.sayText{font:italic 600 25px/1.16 Georgia,serif;margin-top:7px;min-height:58px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.buttons button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px 8px;font-size:11px;font-weight:850}.buttons .panic{grid-column:span 2;background:linear-gradient(135deg,#ef5d90,#cf2f67);color:white;border:0}.buttons .auth{background:var(--green)}.essentials{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.box{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}.box.key{background:#fff8fb}.box.close{background:#fff6dc}.box b{display:block;font-size:10px;text-transform:uppercase;color:#a55272;margin-bottom:6px}.box div{font-size:13px;line-height:1.42}.livefields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.livefields label{display:block;font-size:9px;color:var(--muted);margin:0 0 4px 3px}.save{width:100%;margin-top:8px;border:0;border-radius:15px;padding:13px;background:linear-gradient(135deg,#ef5d90,#cf2f67);color:#fff;font-weight:900}.hint{margin-top:9px;padding:10px 12px;border-radius:14px;background:var(--green);font-size:12px}.more{margin-top:10px}.more details{border:1px solid var(--line);background:#fff;border-radius:18px;padding:12px}.tech{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.source{font-size:9px;color:#a89aa0;margin:10px 4px 35px}@media(max-width:720px){.searchHero h1{font-size:36px}.list{grid-template-columns:1fr;max-height:55vh}.productHead{grid-template-columns:95px 1fr}.visual{height:100px;font-size:40px}.hero h1{font-size:25px}.prices,.essentials,.livefields,.tech{grid-template-columns:1fr}.sayText{font-size:21px}.buttons{grid-template-columns:1fr 1fr}.buttons .panic{grid-column:1/-1}}</style></head><body><div class="app"><div class="top"><div class="crown">♛</div><div class="brand"><strong>BELLEZA BLITZ</strong><span>Host Copilot</span></div><div class="live">● LIVE READY</div></div><section id="searchView"><div class="searchHero"><div class="hello">Hola, hermosa ✨</div><h1>¿Qué producto tienes en tu mano?</h1><p>Busca y recibe todo lo que necesitas para tu live: hook, beneficios, retail, objeciones y cómo cerrar.</p></div><div class="panel"><div class="searchWrap"><input id="q" placeholder="Busca por nombre, marca o categoría..."></div><div class="cats"><button class="cat active" data-cat="all">✨ Todos</button><button class="cat" data-cat="hair">💇‍♀️ Cabello</button><button class="cat" data-cat="skincare">🫧 Skincare</button><button class="cat" data-cat="lip">💋 Labios</button><button class="cat" data-cat="makeup">💄 Maquillaje</button><button class="cat" data-cat="body">🧴 Cuerpo</button></div><div class="sectionTitle"><b>Productos listos ✨</b><span id="count"></span></div><div id="list" class="list"></div></div></section><section id="productView"><div class="productTop"><button class="back" data-action="back">← Otro producto</button><input id="quickSearch" class="quick" placeholder="Busca otro aquí..."></div><div id="productContent"></div></section></div><script>let DB=[],shown=[],cur=null,bi=0,cat='all';const DATA=JSON.parse(localStorage.getItem('bb_live_data')||'{}'),E=id=>document.getElementById(id),N=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');Promise.all(['/bellezablitz-products.json','/bellezablitz-products-wave2.json','/bellezablitz-products-wave3.json'].map(u=>fetch(u).then(r=>r.json()))).then(a=>{let m=new Map;a.flat().forEach(p=>m.set(p.id,p));DB=[...m.values()];filter()}).catch(()=>E('list').innerHTML='<div class="empty">No pude cargar la base 💕</div>');function cm(p){let c=N(p.cat);return cat==='all'||cat==='hair'&&c.includes('hair')||cat==='skincare'&&c.includes('skin')||cat==='lip'&&c.includes('lip')||cat==='makeup'&&(c.includes('makeup')||c.includes('eye')||c.includes('brow'))||cat==='body'&&c.includes('body')}function filter(){let x=N(E('q')?.value);shown=DB.filter(p=>cm(p)&&N(`${p.brand} ${p.name} ${p.cat} ${p.problem||''}`).includes(x));render()}function render(){E('count').textContent=shown.length+' productos';E('list').innerHTML=shown.map(p=>`<div class="item" data-product="${p.id}"><div class="itemTop"><div><span class="brandName">${p.brand}</span><b>${p.name}</b></div><span class="arrow">→</span></div><div class="tags"><span class="tag">${p.cat}</span>${p.status?`<span class="tag stock">${p.status}</span>`:''}${p.retailRef?`<span class="tag retailtag">Retail ${p.retailRef}</span>`:''}</div></div>`).join('')||'<div class="empty">No lo encontré todavía.</div>'}function ico(p){let c=N(p.cat);return c.includes('hair')?'💇‍♀️':c.includes('lip')?'💋':c.includes('skin')?'🫧':c.includes('body')?'🧴':'💄'}function openP(id){cur=DB.find(p=>p.id===id);if(!cur)return;E('searchView').style.display='none';E('productView').style.display='block';scrollTo(0,0);bi=0;let x=DATA[id]||{},r=cur.retailRef||'VERIFICAR',l=x.price||'—';E('productContent').innerHTML=`<div class="hero"><div class="productHead"><div class="visual">${ico(cur)}</div><div><div class="eyebrow">${cur.cat} · ${cur.status||'Ready'}</div><h1>${cur.brand}<br>${cur.name}</h1><div class="meta">${cur.size||''}<br>Goodbye Inventory ${cur.gbiPrice||'verificar'}</div></div></div><div class="prices"><div class="price"><small>RETAIL ORIGINAL</small><strong>${r}</strong><span>Precio de comparación</span></div><div class="price liveprice"><small>PRECIO DEL LIVE 🔥</small><strong>${l}</strong><span>${x.price?'Guardado para este Live':'Agrégalo al confirmar'}</span></div></div><div class="say"><small>🎙 DI ESTO AHORA</small><div id="sayText" class="sayText">${cur.hook}</div></div><div class="buttons"><button class="panic" data-action="blank">ME QUEDÉ EN BLANCO →</button><button data-mode="hook">Otro hook</button><button data-mode="educa">Qué cuento</button><button data-mode="reset">Nueva gente</button><button data-mode="close">Cerrar</button><button class="auth" data-mode="auth">¿Son fake?</button></div><div class="essentials"><div class="box key"><b>⭐ Qué estás vendiendo</b><div>${cur.what}</div></div><div class="box key"><b>💗 Problema / deseo</b><div>${cur.problem}</div></div><div class="box"><b>☷ Puntos clave</b><div>${cur.benefits}</div></div><div class="box"><b>✨ Cómo se usa</b><div>${cur.how}</div></div><div class="box"><b>💬 Objeción</b><div>${cur.objection}</div></div><div class="box"><b>🛍 Cross-sell</b><div>${cur.cross}</div></div><div class="box close"><b>🔥 Cierre rápido</b><div>${x.price?`Retail ${r}; aquí vamos en ${x.price}. ¿Quién se lo lleva?`:'Déjenme confirmar el precio del Live y se los lanzo.'}</div></div><div class="box"><b>🛡 Autenticidad</b><div>Goodbye Inventory declara que sus productos son auténticos y provienen de retailers autorizados, marcas y canales oficiales.</div></div></div><div class="livefields"><div><label>PRECIO LIVE</label><input id="lp" value="${x.price||''}" placeholder="$12"></div><div><label>CANTIDAD</label><input id="lq" value="${x.qty||''}" placeholder="4"></div><div><label>CONDICIÓN</label><input id="lc" value="${x.cond||''}" placeholder="sealed / open box"></div></div><button class="save" data-action="save">GUARDAR PARA ESTE LIVE</button><div class="hint">💕 Problema → 2 beneficios → retail original → precio Live → cierre.</div></div><div class="more"><details><summary>Ver info técnica</summary><div class="tech"><div class="box"><b>Para quién</b><div>${cur.forwho}</div></div><div class="box"><b>Ingredientes / activos</b><div>${cur.ingredients}</div></div></div></details></div><div class="source">Fuente producto oficial. No inventes precio, stock, condición ni beneficios.</div>`}function say(t){let n=E('sayText');if(n){n.textContent=t;n.scrollIntoView({behavior:'smooth',block:'center'})}}function mode(m){if(!cur)return;let x=DATA[cur.id]||{},r=cur.retailRef||'VERIFICAR',a={hook:[cur.hook,`Chicas, si ${cur.problem}, miren esto.`,`¿Quién aquí usaría ${cur.name} en su rutina?`],educa:[`Lo importante: ${cur.benefits}`,`Se usa así: ${cur.how}`,`Este producto es para: ${cur.forwho}`],reset:[`Para las que acaban de entrar, bienvenidas 💕 Estamos con ${cur.name} de ${cur.brand}.`,`Si acabas de llegar: retail ${r}. Les cuento rápido qué hace.`],close:[x.price?`Retail ${r}; aquí vamos en ${x.price}. ¿Quién se lo lleva?`:'Déjenme confirmar el precio del Live antes de lanzarlo.',x.qty?`Tenemos ${x.qty} confirmadas.`:'Déjenme verificar stock.',`Si te llevaste esto, mira: ${cur.cross}.`],auth:[`Goodbye Inventory indica que sus productos son auténticos y vienen de retailers autorizados, marcas y canales oficiales.`,`Son productos de liquidation, overstock y closeout; por eso el precio puede ser mucho menor que retail.`]}[m]||[];if(a.length)say(a[Math.floor(Math.random()*a.length)])}function blank(){let x=DATA[cur.id]||{},r=cur.retailRef||'VERIFICAR',p=[cur.hook,`Este es ${cur.name} de ${cur.brand}. Lo importante: ${cur.benefits}`,`¿A quién le pasa esto? Las leo en el chat.`,`Retail original ${r}. Aquí está el deal.`,`Si te gustó, mira: ${cur.cross}.`];if(x.price)p.push(`Retail ${r}, aquí vamos en ${x.price}. ¿Quién se lo lleva?`);bi=(bi+1)%p.length;say(p[bi])}function save(){DATA[cur.id]={price:E('lp').value.trim(),qty:E('lq').value.trim(),cond:E('lc').value.trim()};localStorage.setItem('bb_live_data',JSON.stringify(DATA));openP(cur.id)}document.addEventListener('input',e=>{if(e.target.id==='q')filter()});document.addEventListener('keydown',e=>{if(e.target.id==='quickSearch'&&e.key==='Enter'){let x=N(e.target.value),p=DB.find(p=>N(`${p.brand} ${p.name}`).includes(x));if(p)openP(p.id)}});document.addEventListener('click',e=>{let p=e.target.closest('[data-product]');if(p)return openP(p.dataset.product);let c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b===c));return filter()}let b=e.target.closest('button');if(!b)return;if(b.dataset.action==='back'){E('productView').style.display='none';E('searchView').style.display='block';E('q').value='';cat='all';document.querySelectorAll('.cat').forEach((x,i)=>x.classList.toggle('active',i===0));filter();scrollTo(0,0)}else if(b.dataset.action==='blank')blank();else if(b.dataset.action==='save')save();else if(b.dataset.mode)mode(b.dataset.mode)});</script></body></html>
