<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BellezaBlitz Host Copilot</title><style>:root{--bg:#fffaf7;--panel:#fff;--ink:#332b2d;--muted:#8f8184;--rose:#e76d9c;--rose2:#f8d7e4;--blush:#fff0f5;--cream:#f8efe8;--line:#eadfe2;--green:#eaf8ef;--warn:#fff6da}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffaf7 0%,#fff 55%,#fff8fb 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}button,input{font:inherit}.app{max-width:1050px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.logo{font-weight:900;letter-spacing:.09em;font-size:14px}.logo b{color:var(--rose)}.live{font-size:11px;background:var(--blush);color:#a74670;border:1px solid #f2bfd3;border-radius:999px;padding:8px 11px}.searchView h1{font-size:34px;line-height:1.05;margin:8px 0}.searchView p{color:var(--muted);margin:0 0 18px}.searchBox{background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 35px rgba(125,79,94,.08);border-radius:22px;padding:14px}.searchRow{display:grid;grid-template-columns:1fr 160px;gap:9px}.searchRow input{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;color:var(--ink)}.primary{border:0;background:var(--rose);color:#fff;border-radius:14px;padding:14px 16px;font-weight:850;cursor:pointer}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:13px;max-height:62vh;overflow:auto}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;cursor:pointer}.item:hover{border-color:#e5a4bc}.item b{display:block;font-size:14px}.item span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.productView{display:none}.productTop{position:sticky;top:0;z-index:20;background:rgba(255,250,247,.92);backdrop-filter:blur(12px);padding:8px 0 12px;display:flex;gap:9px;align-items:center}.back{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 13px;font-weight:800;cursor:pointer}.quickSearch{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;color:var(--ink)}.hero{background:linear-gradient(135deg,#fff 0%,#fff5f8 100%);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:0 14px 40px rgba(133,76,96,.08)}.eyebrow{font-size:11px;color:#b45b7d;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hero h1{font-size:34px;line-height:1.05;margin:7px 0 8px}.meta{color:var(--muted);font-size:12px}.heroGrid{display:grid;grid-template-columns:1.4fr .8fr;gap:12px;margin-top:15px}.say{background:var(--rose2);border-radius:20px;padding:18px}.say small{display:block;color:#9d4a6d;font-weight:850;letter-spacing:.05em;margin-bottom:7px}.say div{font-size:24px;font-weight:900;line-height:1.2}.priceCard{background:var(--cream);border-radius:20px;padding:18px}.priceCard small{display:block;color:#8f7d76;font-size:10px;letter-spacing:.08em}.priceCard strong{font-size:31px;display:block;margin:4px 0}.liveInputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.liveInputs input{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px}.liveInputs label{display:block;color:var(--muted);font-size:10px;margin:0 0 4px 2px}.save{margin-top:8px;width:100%}.section{margin-top:13px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.card h3{font-size:11px;margin:0 0 7px;color:#a05a73;text-transform:uppercase;letter-spacing:.07em}.card div{font-size:14px;line-height:1.42}.miniTip{background:var(--green);border:1px solid #d6eedf;border-radius:16px;padding:12px 14px;font-size:13px;margin-top:10px}.stepsTitle{font-weight:900;margin:18px 0 8px}.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.step{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.step b{display:block;font-size:11px;color:#ae6c84;margin-bottom:6px}.step div{font-size:15px;font-weight:700;line-height:1.4}.step.warn{background:var(--warn)}.controls{position:sticky;bottom:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:9px;margin-top:14px;box-shadow:0 16px 40px rgba(114,72,87,.15)}.controlsGrid{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:7px}.controls button{border:0;border-radius:12px;padding:11px;background:#f8f1f3;color:var(--ink);font-weight:800;cursor:pointer}.controls .primary{background:var(--rose);color:#fff}.source{font-size:10px;color:#a4999c;margin:12px 4px 90px}.source a{color:#b34d75}@media(max-width:760px){.app{padding:12px}.searchView h1,.hero h1{font-size:28px}.searchRow,.heroGrid,.cards,.steps,.liveInputs{grid-template-columns:1fr}.list{grid-template-columns:1fr}.say div{font-size:21px}.controlsGrid{grid-template-columns:1fr 1fr}.controls .primary{grid-column:1/-1}}</style></head><body><div class="app"><header><div class="logo">BELLEZA<b>BLITZ</b> • HOST COPILOT</div><div class="live">● LIVE READY</div></header><section id="searchView" class="searchView"><div class="eyebrow">Tu apoyo durante el Live 💕</div><h1>Busca el producto.<br>Yo te preparo lo demás.</h1><p>Elige uno y la pantalla se limpia para que te concentres solo en vender.</p><div class="searchBox"><div class="searchRow"><input id="q" placeholder="Ej. Tatcha, Olaplex, lip gloss, hair mask..." oninput="filterList()"><button class="primary" onclick="openFirst()">VER PRODUCTO</button></div><div id="list" class="list"></div></div></section><section id="productView" class="productView"><div class="productTop"><button class="back" onclick="goBack()">← Otro producto</button><input id="quickSearch" class="quickSearch" placeholder="Busca otro aquí..." onkeydown="if(event.key==='Enter') quickOpen()"></div><div id="productContent"></div></section></div><script>let DB=[],shown=[],cur=null,lines=[],idx=0;const INTERNAL=JSON.parse(localStorage.getItem('bb_live_data')||'{}');const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');fetch('/bellezablitz-products.json').then(r=>r.json()).then(d=>{DB=d;shown=d;renderList()}).catch(()=>document.getElementById('list').innerHTML='<div class="item"><b>No pude cargar la base.</b><span>Recarga la página 💕</span></div>');function renderList(){list.innerHTML=shown.map(p=>`<div class="item" onclick="openProduct('${p.id}')"><b>${p.brand} · ${p.name}</b><span>${p.cat} · ${p.status||''}</span></div>`).join('')||'<div class="item"><b>No encontré coincidencias.</b><span>Prueba con marca o una palabra del producto.</span></div>'}function filterList(){const x=norm(q.value);shown=DB.filter(p=>norm(`${p.brand} ${p.name} ${p.cat} ${p.problem}`).includes(x));renderList()}function openFirst(){if(shown[0])openProduct(shown[0].id)}function goBack(){productView.style.display='none';searchView.style.display='block';q.value='';shown=DB;renderList();window.scrollTo({top:0,behavior:'smooth'})}function quickOpen(){const x=norm(quickSearch.value);const p=DB.find(p=>norm(`${p.brand} ${p.name}`).includes(x));if(p){quickSearch.value='';openProduct(p.id)}}function openProduct(id){cur=DB.find(p=>p.id===id);if(!cur)return;searchView.style.display='none';productView.style.display='block';window.scrollTo({top:0,behavior:'instant'});const x=INTERNAL[id]||{};productContent.innerHTML=`<div class="hero"><div class="eyebrow">${cur.cat} · ${cur.status||'Ready'}</div><h1>${cur.brand}<br>${cur.name}</h1><div class="meta">${cur.size||''} · Goodbye Inventory ${cur.gbiPrice||'verificar'} · Retail ref ${cur.retailRef||'verificar'}</div><div class="heroGrid"><div class="say"><small>⚡ DI ESTO AHORA</small><div id="teleline">${cur.hook}</div></div><div class="priceCard"><small>PRECIO DE REFERENCIA</small><strong>${cur.retailRef||'Verificar'}</strong><div class="meta">GBI: ${cur.gbiPrice||'verificar'}<br>No asumir que es el precio del Live.</div></div></div><div class="liveInputs"><div><label>PRECIO DEL LIVE</label><input id="lp" value="${x.price||''}" placeholder="Ej. $12"></div><div><label>CUÁNTOS HAY</label><input id="lq" value="${x.qty||''}" placeholder="Ej. 4"></div><div><label>CONDICIÓN</label><input id="lc" value="${x.cond||''}" placeholder="sealed / unboxed"></div></div><button class="primary save" onclick="saveLive()">Guardar para este Live</button></div><div class="section cards"><div class="card"><h3>Qué es</h3><div>${cur.what}</div></div><div class="card"><h3>Qué problema vendemos</h3><div>${cur.problem}</div></div><div class="card"><h3>Por qué le puede gustar</h3><div>${cur.benefits}</div></div><div class="card"><h3>Cómo se usa</h3><div>${cur.how}</div></div><div class="card"><h3>Para quién es</h3><div>${cur.forwho}</div></div><div class="card"><h3>Si me preguntan…</h3><div>${cur.objection}</div></div><div class="card"><h3>Ingredientes / activos</h3><div>${cur.ingredients}</div></div><div class="card"><h3>Qué le combina</h3><div>${cur.cross}</div></div></div><div class="miniTip">✨ No tienes que decirlo todo. Usa 2–3 puntos, haz una pregunta y sigue moviendo el Live.</div><div class="stepsTitle">Tu flow de 7 pasos</div><div class="steps"><div class="step"><b>1 · ENTRA NATURAL</b><div>${cur.hook}</div></div><div class="step"><b>2 · MÉTELAS EN LA CONVERSACIÓN</b><div>“¿A quién le pasa esto? Cuéntenme en el chat.”</div></div><div class="step"><b>3 · DI QUÉ ES</b><div>“Este es ${cur.name} de ${cur.brand}.”</div></div><div class="step"><b>4 · CUENTA LO MÁS IMPORTANTE</b><div>${cur.benefits}</div></div><div class="step"><b>5 · HABLA DEL VALOR</b><div>“De referencia está en ${cur.retailRef||'___'}. Aquí lo estamos moviendo diferente.”</div></div><div class="step warn"><b>6 · URGENCIA SOLO SI ES REAL</b><div>${x.qty?`“Tenemos ${x.qty} confirmadas.”`:'Cantidad no confirmada. No inventes escasez.'}</div></div><div class="step"><b>7 · CIERRA</b><div>${x.price?`“Ok chicas, vamos en ${x.price}. ¿Quién se lo lleva?”`:'Confirma el precio antes de lanzar.'}</div></div><div class="step"><b>+ SUBE EL TICKET</b><div>“Si te llevaste esto, mira lo que combina: ${cur.cross}.”</div></div></div><div class="controls"><div class="controlsGrid"><button class="primary" onclick="nextLine()">ME QUEDÉ EN BLANCO →</button><button onclick="mode('hook')">OTRO HOOK</button><button onclick="mode('educa')">QUÉ CUENTO</button><button onclick="mode('reset')">NUEVA GENTE</button><button onclick="mode('close')">CERRAR</button></div></div><div class="source">Fuente: <a href="${cur.source}" target="_blank">ver fuente oficial</a> · Claims médicos no permitidos.</div>`;mode('hook',false)}function saveLive(){INTERNAL[cur.id]={price:lp.value.trim(),qty:lq.value.trim(),cond:lc.value.trim()};localStorage.setItem('bb_live_data',JSON.stringify(INTERNAL));openProduct(cur.id)}function getLines(m){const x=INTERNAL[cur.id]||{};return{hook:[cur.hook,`“Chicas, si esto les pasa, miren ${cur.name} de ${cur.brand}.”`,`“A ver, ¿quién aquí usaría esto en su rutina?”`],educa:[`“Básicamente, esto es ${cur.what.toLowerCase()}”`,cur.benefits,`“Lo importante aquí: ${cur.ingredients}”`,`“Y se usa así: ${cur.how}”`],reset:[`“Para las chicas que acaban de entrar, bienvenidas 💕 Estamos haciendo beauty deals en vivo y todo se mueve rápido.”`,`“Ahora mismo estamos con ${cur.name} de ${cur.brand}.”`,`“Si acabas de llegar, quédate porque ya vamos con el próximo.”`],close:[x.price?`“Ok chicas, vamos en ${x.price}. ¿Quién se lo lleva?”`:'Confirma el precio antes de vender.',x.qty?`“Tenemos ${x.qty} confirmadas, así que si te gustó, no te duermas.”`:'No hay cantidad confirmada. Cierra sin falsa escasez.',`“Y si te llevaste esto, mira lo que combina: ${cur.cross}.”`]}[m]}function mode(m,show=true){lines=getLines(m);idx=0;if(show)teleline.textContent=lines[0]}function nextLine(){idx=(idx+1)%lines.length;teleline.textContent=lines[idx]}</script></body></html>
