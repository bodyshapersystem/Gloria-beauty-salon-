<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Belleza Blitz Host Copilot V3</title><style>html,body{margin:0;height:100%;background:#fff8fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="/bellezablitz-host-v2.html"></iframe><script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{
 const w=f.contentWindow,d=f.contentDocument;
 const css=d.createElement('style');css.textContent=`
 .mark{width:58px!important;height:58px!important;background:transparent!important;box-shadow:none!important}.mark svg{width:58px;height:58px;filter:drop-shadow(0 8px 18px #bb2f6040)}
 .art,.visual{background:linear-gradient(145deg,#fff3f7,#ffdce8)!important;overflow:hidden!important;display:grid!important;place-items:center!important}.art{height:155px!important;padding:10px!important}.visual{padding:12px!important}.art img,.visual img{display:block!important;width:auto!important;height:auto!important;max-width:88%!important;max-height:88%!important;object-fit:contain!important;mix-blend-mode:multiply}.photoSlot{width:100%;height:100%;display:grid;place-items:center;overflow:hidden}.photoSlot img{max-width:88%!important;max-height:88%!important}.photoFallback{display:grid;place-items:center;text-align:center;color:#b46985;font-size:10px;gap:4px}.photoFallback b{font-size:38px}.nav{cursor:pointer;user-select:none}.nav.active{transform:translateY(-1px)}
 .bbToast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);width:min(620px,calc(100% - 28px));background:#2f1721;color:white;border-radius:18px;padding:12px 14px;z-index:99;box-shadow:0 18px 44px #33121f44;font-size:12px;line-height:1.4}.bbToast b{display:block;font:600 17px Georgia,serif;margin-bottom:3px}.bbToast button{position:absolute;right:9px;top:9px;border:0;background:#ffffff22;color:white;border-radius:50%;width:25px;height:25px}
 .hostSheet{position:fixed;inset:0;z-index:98;background:#fff8fb;overflow:auto;padding:18px 14px 110px}.hostTop{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:auto}.hostClose{border:1px solid #efdce4;background:#fff;border-radius:999px;padding:10px 13px;font-weight:800}.hostHead{max-width:760px;margin:18px auto 12px;background:linear-gradient(135deg,#fff,#ffe6ef);border:1px solid #f0dbe4;border-radius:28px;padding:20px;box-shadow:0 18px 44px #7c365018}.hostHead small{color:#b62b60;font-weight:900}.hostHead h2{font:600 34px/1 Georgia,serif;margin:5px 0 8px}.hostHead p{margin:0;color:#856e77;font-size:12px;line-height:1.45}.hostGrid{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:9px}.hostCard{background:#fff;border:1px solid #efdce4;border-radius:18px;padding:12px}.hostCard label{display:block;font-size:9px;font-weight:900;color:#a34c6d;text-transform:uppercase;margin-bottom:5px}.hostCard input,.hostCard textarea{width:100%;border:0;background:#fff6f9;border-radius:12px;padding:10px;outline:none;color:#2c1921}.hostCard textarea{min-height:72px;resize:vertical}.hostWide{grid-column:1/-1}.hostSave{max-width:760px;width:100%;display:block;margin:10px auto 0;border:0;border-radius:16px;padding:14px;background:linear-gradient(135deg,#ee5b8e,#c82d65);color:#fff;font-weight:900}.hostMini{max-width:760px;margin:10px auto 0;background:#edf8f1;border-radius:16px;padding:12px;font-size:11px;line-height:1.45}@media(max-width:620px){.hostGrid{grid-template-columns:1fr}.hostWide{grid-column:auto}.hostHead h2{font-size:29px}}
 `;d.head.appendChild(css);
 const mark=d.querySelector('.mark');if(mark)mark.innerHTML='<svg viewBox="0 0 120 120" aria-label="Belleza Blitz Live"><defs><radialGradient id="bbg"><stop offset="0" stop-color="#ff9aba"/><stop offset=".55" stop-color="#bd2456"/><stop offset="1" stop-color="#250812"/></radialGradient><path id="ta" d="M18 59 A42 42 0 0 1 102 59"/><path id="ba" d="M101 67 A42 42 0 0 1 19 67"/></defs><circle cx="60" cy="60" r="55" fill="#17070d" stroke="#ff4b88" stroke-width="3"/><circle cx="60" cy="60" r="48" fill="none" stroke="#ff9abb"/><text fill="#fff" font-size="10" font-family="Georgia" letter-spacing="2"><textPath href="#ta" startOffset="50%" text-anchor="middle">BELLEZA BLITZ</textPath></text><text fill="#fff" font-size="10" font-family="Georgia" letter-spacing="4"><textPath href="#ba" startOffset="50%" text-anchor="middle">LIVE</textPath></text><text x="60" y="70" text-anchor="middle" fill="url(#bbg)" stroke="#ffd0df" stroke-width=".5" font-size="38" font-family="Georgia" font-weight="700">BB</text></svg>';
 const oldIco=w.ico;
 const exact={
  'grow-density':'https://goodbyeinventory.com/cdn/shop/files/grow-gorgeous-intense-hair-density-serum-2-0-oz-12-1.jpg?v=1779477792&width=900',
  'sdj-bumbum':'https://goodbyeinventory.com/cdn/shop/files/2618131.avif?v=1773938654&width=900',
  'rem-pinkrazor':'https://goodbyeinventory.com/cdn/shop/files/rem.jpg?v=1781535132&width=900',
  'grow-mask':'https://goodbyeinventory.com/cdn/shop/files/growg8097.jpg?v=1781537764&width=900'
 };
 function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
 w.ico=function(p){const u=exact[p.id];if(u)return '<img src="'+u+'" alt="'+esc(p.brand+' '+p.name)+'" loading="lazy">';const q=esc([p.brand,p.name,p.size].filter(Boolean).join(' '));return '<span class="photoSlot" data-photo-q="'+q+'" data-product-id="'+esc(p.id)+'"><span class="photoFallback"><b>'+oldIco(p)+'</b>Buscando foto real…</span></span>'};
 let pending=false;
 async function hydrate(){pending=false;const slots=[...d.querySelectorAll('.photoSlot[data-photo-q]:not([data-loaded])')];for(const slot of slots){slot.dataset.loaded='1';try{const q=slot.dataset.photoQ;const r=await fetch('/api/gbi-image?q='+encodeURIComponent(q));const j=await r.json();if(j.ok&&j.image&&Number(j.score||0)>=0.42){slot.innerHTML='<img src="'+j.image+'" alt="'+esc(j.title||q)+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<span class=photoFallback><b>♡</b>Imagen en verificación</span>\'">';slot.title='Goodbye Inventory: '+(j.title||'producto verificado')}else slot.innerHTML='<span class="photoFallback"><b>♡</b>Imagen en verificación</span>'}catch(e){slot.innerHTML='<span class="photoFallback"><b>♡</b>Imagen en verificación</span>'}}}
 function schedule(){if(!pending){pending=true;setTimeout(hydrate,50)}}
 new MutationObserver(schedule).observe(d.body,{childList:true,subtree:true});
 try{w.render()}catch(e){}schedule();
 function toast(title,text){d.querySelector('.bbToast')?.remove();const n=d.createElement('div');n.className='bbToast';n.innerHTML='<button>×</button><b>'+title+'</b>'+text;n.querySelector('button').onclick=()=>n.remove();d.body.appendChild(n);setTimeout(()=>n.remove(),5000)}
 const defaults={name:'Host BellezaBlitz',role:'Live Host · Beauty Creator',channel:'Canal Español',next:'Miércoles · tentativo',arrival:'Por confirmar',duration:'Por confirmar',pay:'Por confirmar',commission:'Por confirmar',days:'Por confirmar',manager:'Annette',notes:'Confirmar horario, duración del streaming, pago/base y estructura de comisión antes del primer Live.'};
 function loadHost(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem('bb_host_profile')||'{}'))}catch(e){return defaults}}
 function showHost(){d.querySelector('.hostSheet')?.remove();const h=loadHost(),s=d.createElement('section');s.className='hostSheet';s.innerHTML=`<div class="hostTop"><strong>Mi perfil de Host</strong><button class="hostClose">← Volver</button></div><div class="hostHead"><small>BELLEZA BLITZ LIVE ✨</small><h2>${esc(h.name)}</h2><p>Todo lo que necesitas saber antes de salir en vivo. Los campos que aún no estén confirmados deben quedarse como “Por confirmar”.</p></div><div class="hostGrid"><div class="hostCard"><label>Nombre</label><input data-h="name" value="${esc(h.name)}"></div><div class="hostCard"><label>Rol</label><input data-h="role" value="${esc(h.role)}"></div><div class="hostCard"><label>Canal</label><input data-h="channel" value="${esc(h.channel)}"></div><div class="hostCard"><label>Próximo Live</label><input data-h="next" value="${esc(h.next)}"></div><div class="hostCard"><label>Hora de llegada</label><input data-h="arrival" value="${esc(h.arrival)}"></div><div class="hostCard"><label>Duración del streaming</label><input data-h="duration" value="${esc(h.duration)}" placeholder="Ej. 2 horas"></div><div class="hostCard"><label>Pago / base</label><input data-h="pay" value="${esc(h.pay)}" placeholder="Ej. $25/h"></div><div class="hostCard"><label>Comisión / bonos</label><input data-h="commission" value="${esc(h.commission)}"></div><div class="hostCard"><label>Días asignados</label><input data-h="days" value="${esc(h.days)}"></div><div class="hostCard"><label>Manager / contacto</label><input data-h="manager" value="${esc(h.manager)}"></div><div class="hostCard hostWide"><label>Notas operativas</label><textarea data-h="notes">${esc(h.notes)}</textarea></div></div><button class="hostSave">GUARDAR MI INFORMACIÓN</button><div class="hostMini"><b>Antes del Live:</b> confirma hora de llegada, duración, pago/bonos, lista de productos, precio de salida, cantidad y condición. Si algo no está confirmado, no lo inventes.</div>`;s.querySelector('.hostClose').onclick=()=>s.remove();s.querySelector('.hostSave').onclick=()=>{const out={};s.querySelectorAll('[data-h]').forEach(el=>out[el.dataset.h]=el.value.trim()||'Por confirmar');localStorage.setItem('bb_host_profile',JSON.stringify(out));toast('Perfil guardado 💕','La información de esta host quedó guardada en este dispositivo.');s.remove()};d.body.appendChild(s)}
 const nav=[...d.querySelectorAll('.bottom .nav')];
 function active(i){nav.forEach((n,k)=>n.classList.toggle('active',k===i))}
 nav.forEach((n,i)=>n.addEventListener('click',()=>{
  active(i);
  if(i===0){try{w.eval("document.getElementById('detail').style.display='none';document.getElementById('home').style.display='block';document.getElementById('q').value='';cat='all';document.querySelectorAll('.cat').forEach((b,k)=>b.classList.toggle('active',k===0));filter();scrollTo(0,0)")}catch(e){} }
  if(i===1){try{w.eval("document.getElementById('detail').style.display='none';document.getElementById('home').style.display='block';setTimeout(()=>{document.getElementById('q').focus();document.getElementById('q').scrollIntoView({behavior:'smooth',block:'center'})},80)")}catch(e){} }
  if(i===2){try{w.eval("document.getElementById('detail').style.display='none';document.getElementById('home').style.display='block';shown=DB.filter(p=>S[p.id]&&(S[p.id].price||S[p.id].qty||S[p.id].cond));render();scrollTo(0,0)");toast('Mis productos del Live','Aquí aparecen los productos donde ya guardaste precio, cantidad o condición.')}catch(e){toast('Mis listas','Guarda un producto para verlo aquí durante el Live.')} }
  if(i===3){try{w.eval("var livePick=DB.find(p=>S[p.id]&&S[p.id].price)||DB[0];if(livePick)openP(livePick.id);setTimeout(()=>document.getElementById('sayText')?.scrollIntoView({behavior:'smooth',block:'center'}),100)")}catch(e){} }
  if(i===4)showHost();
 }));
});
</script></body></html>
