<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Belleza Blitz Host Copilot V3</title><style>html,body{margin:0;height:100%;background:#fff8fb}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="/bellezablitz-host-v2.html"></iframe><script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{
 const w=f.contentWindow,d=f.contentDocument;
 const css=d.createElement('style');css.textContent=`
 .mark{width:58px!important;height:58px!important;background:transparent!important;box-shadow:none!important}.mark svg{width:58px;height:58px;filter:drop-shadow(0 8px 18px #bb2f6040)}
 .art img,.visual img{width:100%;height:100%;object-fit:contain;padding:10px;mix-blend-mode:multiply}.art{height:155px!important}.visual{overflow:hidden}.photoSlot{width:100%;height:100%;display:grid;place-items:center}.photoFallback{display:grid;place-items:center;text-align:center;color:#b46985;font-size:10px;gap:4px}.photoFallback b{font-size:38px}.nav{cursor:pointer;user-select:none}.nav.active{transform:translateY(-1px)}
 .bbToast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);width:min(620px,calc(100% - 28px));background:#2f1721;color:white;border-radius:18px;padding:12px 14px;z-index:99;box-shadow:0 18px 44px #33121f44;font-size:12px;line-height:1.4}.bbToast b{display:block;font:600 17px Georgia,serif;margin-bottom:3px}.bbToast button{position:absolute;right:9px;top:9px;border:0;background:#ffffff22;color:white;border-radius:50%;width:25px;height:25px}
 `;d.head.appendChild(css);
 const mark=d.querySelector('.mark');if(mark)mark.innerHTML='<svg viewBox="0 0 120 120" aria-label="Belleza Blitz Live"><defs><radialGradient id="bbg"><stop offset="0" stop-color="#ff9aba"/><stop offset=".55" stop-color="#bd2456"/><stop offset="1" stop-color="#250812"/></radialGradient><path id="ta" d="M18 59 A42 42 0 0 1 102 59"/><path id="ba" d="M101 67 A42 42 0 0 1 19 67"/></defs><circle cx="60" cy="60" r="55" fill="#17070d" stroke="#ff4b88" stroke-width="3"/><circle cx="60" cy="60" r="48" fill="none" stroke="#ff9abb"/><text fill="#fff" font-size="10" font-family="Georgia" letter-spacing="2"><textPath href="#ta" startOffset="50%" text-anchor="middle">BELLEZA BLITZ</textPath></text><text fill="#fff" font-size="10" font-family="Georgia" letter-spacing="4"><textPath href="#ba" startOffset="50%" text-anchor="middle">LIVE</textPath></text><text x="60" y="70" text-anchor="middle" fill="url(#bbg)" stroke="#ffd0df" stroke-width=".5" font-size="38" font-family="Georgia" font-weight="700">BB</text></svg>';
 const oldIco=w.ico;
 const exact={
  'grow-density':'https://goodbyeinventory.com/cdn/shop/files/grow-gorgeous-intense-hair-density-serum-2-0-oz-12-1.jpg?v=1779477792&width=900',
  'sdj-bumbum':'https://goodbyeinventory.com/cdn/shop/files/2618131.avif?v=1773938654&width=900',
  'rem-pinkrazor':'https://goodbyeinventory.com/cdn/shop/files/rem.jpg?v=1781535132&width=900',
  'grow-mask':'https://goodbyeinventory.com/cdn/shop/files/growg8097.jpg?v=1781537764&width=900'
 };
 function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
 w.ico=function(p){const u=exact[p.id];if(u)return '<img src="'+u+'" alt="'+esc(p.brand+' '+p.name)+'" loading="lazy">';const q=esc([p.brand,p.name,p.size].filter(Boolean).join(' '));return '<span class="photoSlot" data-photo-q="'+q+'" data-product-id="'+esc(p.id)+'"><span class="photoFallback"><b>'+oldIco(p)+'</b>Buscando foto real…</span></span>'};
 let pending=false;
 async function hydrate(){pending=false;const slots=[...d.querySelectorAll('.photoSlot[data-photo-q]:not([data-loaded])')];for(const slot of slots){slot.dataset.loaded='1';try{const q=slot.dataset.photoQ;const r=await fetch('/api/gbi-image?q='+encodeURIComponent(q));const j=await r.json();if(j.ok&&j.image&&Number(j.score||0)>=0.42){slot.innerHTML='<img src="'+j.image+'" alt="'+esc(j.title||q)+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<span class=photoFallback><b>♡</b>Imagen en verificación</span>\'">';slot.title='Goodbye Inventory: '+(j.title||'producto verificado')}else slot.innerHTML='<span class="photoFallback"><b>'+oldIco({cat:''})+'</b>Imagen en verificación</span>'}catch(e){slot.innerHTML='<span class="photoFallback"><b>♡</b>Imagen en verificación</span>'}}}
 function schedule(){if(!pending){pending=true;setTimeout(hydrate,50)}}
 new MutationObserver(schedule).observe(d.body,{childList:true,subtree:true});
 try{w.render()}catch(e){}schedule();
 function toast(title,text){d.querySelector('.bbToast')?.remove();const n=d.createElement('div');n.className='bbToast';n.innerHTML='<button>×</button><b>'+title+'</b>'+text;n.querySelector('button').onclick=()=>n.remove();d.body.appendChild(n);setTimeout(()=>n.remove(),5000)}
 const nav=[...d.querySelectorAll('.bottom .nav')];
 function active(i){nav.forEach((n,k)=>n.classList.toggle('active',k===i))}
 nav.forEach((n,i)=>n.addEventListener('click',()=>{
  active(i);
  if(i===0){try{w.eval("document.getElementById('detail').style.display='none';document.getElementById('home').style.display='block';document.getElementById('q').value='';cat='all';document.querySelectorAll('.cat').forEach((b,k)=>b.classList.toggle('active',k===0));filter();scrollTo(0,0)")}catch(e){} }
  if(i===1){try{w.eval("document.getElementById('detail').style.display='none';document.getElementById('home').style.display='block';setTimeout(()=>{document.getElementById('q').focus();document.getElementById('q').scrollIntoView({behavior:'smooth',block:'center'})},80)")}catch(e){} }
  if(i===2){try{w.eval("document.getElementById('detail').style.display='none';document.getElementById('home').style.display='block';shown=DB.filter(p=>S[p.id]&&(S[p.id].price||S[p.id].qty||S[p.id].cond));render();scrollTo(0,0)");toast('Mis productos del Live','Aquí aparecen los productos donde ya guardaste precio, cantidad o condición.')}catch(e){toast('Mis listas','Guarda un producto para verlo aquí durante el Live.')} }
  if(i===3){try{w.eval("var livePick=DB.find(p=>S[p.id]&&S[p.id].price)||DB[0];if(livePick)openP(livePick.id);setTimeout(()=>document.getElementById('sayText')?.scrollIntoView({behavior:'smooth',block:'center'}),100)")}catch(e){} }
  if(i===4){toast('Host Mode ✨','Problema → 2 beneficios → retail original → precio Live → cierre. Si no sabes algo, usa “Déjame verificarlo para darte la información correcta.”')}
 }));
});
</script></body></html>
