<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Belleza Blitz Host Copilot V2</title><style>:root{--ink:#26171e;--muted:#8b747e;--berry:#b91f58;--hot:#ee4e86;--pink:#ffd7e5;--blush:#fff0f5;--cream:#fffaf7;--line:#f0dde4;--green:#edf8f1;--yellow:#fff4d9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#ffe7ef 0,transparent 28%),linear-gradient(180deg,#fff8fb,#fff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{max-width:1020px;margin:auto;padding:14px 14px 92px}.mast{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}.mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:white;background:radial-gradient(circle at 50% 35%,#ff9abc,#c91e59 58%,#43101f 100%);font:700 18px Georgia,serif;box-shadow:0 8px 24px #c22b6030}.brand{text-align:center}.brand strong{font:600 19px Georgia,serif;letter-spacing:.16em}.brand span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.status{width:42px;height:42px;border-radius:50%;background:white;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 6px 18px #7d395515}.welcome{background:linear-gradient(135deg,#fff 0,#fff7fa 54%,#ffe8f0 100%);border:1px solid #f5dce6;border-radius:32px;padding:24px 22px;box-shadow:0 22px 60px #8e39571a;position:relative;overflow:hidden}.welcome:after{content:'♡';position:absolute;right:20px;top:7px;font:italic 72px Georgia,serif;color:#f2b6cc55;transform:rotate(-11deg)}.hi{color:var(--berry);font-weight:750;font-size:14px}.welcome h1{font:500 48px/.95 Georgia,serif;letter-spacing:-.045em;margin:8px 0 10px;max-width:620px}.welcome p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:620px}.searchCard{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:15px;box-shadow:0 20px 50px #883b5612}.search{position:relative}.search:before{content:'⌕';position:absolute;left:16px;top:8px;font-size:26px;color:#8c737d}.search input{width:100%;border:1px solid #efdee5;background:#fff;border-radius:20px;padding:16px 16px 16px 49px;outline:none;font-size:15px;box-shadow:inset 0 1px 0 #fff}.search input:focus{border-color:#efa1bc;box-shadow:0 0 0 4px #fff0f5}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.cat{border:0;background:transparent;padding:0;color:var(--ink);font-size:10px;font-weight:750}.catIcon{width:58px;height:58px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#fff,#ffe4ed);border:1px solid #f2dbe4;box-shadow:0 8px 20px #8d39530d}.cat.active .catIcon{outline:3px solid #ffd1e1;background:linear-gradient(145deg,#fff,#ffd3e2)}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.sectionHead b{font:600 22px Georgia,serif}.sectionHead span{font-size:10px;color:var(--berry);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.prod{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 10px 28px #7b405211;cursor:pointer}.art{height:128px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#fff 0,#ffe8ef 45%,#f6d6e1 100%);font-size:48px}.badge{position:absolute;left:10px;top:10px;background:#e93876;color:#fff;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800}.heart{position:absolute;right:10px;top:10px;width:29px;height:29px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#c22d60}.pbody{padding:12px}.brandN{font-size:9px;color:#b34a70;text-transform:uppercase;letter-spacing:.08em;font-weight:850}.pbody h3{font:600 18px/1.1 Georgia,serif;margin:4px 0}.pmeta{display:flex;justify-content:space-between;gap:8px;align-items:end}.pill{font-size:9px;padding:5px 7px;border-radius:999px;background:#fff0f5;color:#9c4969}.rprice{font:600 20px Georgia,serif}.empty{grid-column:1/-1;text-align:center;padding:30px;color:var(--muted)}#detail{display:none}.detailTop{position:sticky;top:0;z-index:20;display:flex;gap:8px;background:#fff8fbed;padding:8px 0;backdrop-filter:blur(14px)}.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;font-weight:800}.quick{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:#fff}.hero{background:#fff;border:1px solid var(--line);border-radius:30px;padding:16px;box-shadow:0 20px 55px #73344d16}.head{display:grid;grid-template-columns:145px 1fr;gap:16px;align-items:center}.visual{height:145px;border-radius:26px;background:radial-gradient(circle at 50% 30%,#fff,#ffe3ed 45%,#f2c4d5);display:grid;place-items:center;font-size:58px;position:relative}.rank{position:absolute;left:10px;top:10px;background:#fff8e7;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800;color:#9e6b16}.eyebrow{font-size:9px;color:#b44b71;text-transform:uppercase;letter-spacing:.08em;font-weight:900}.hero h2{font:600 32px/1 Georgia,serif;margin:5px 0}.meta{font-size:11px;color:var(--muted);line-height:1.4}.prices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.price{border-radius:18px;padding:13px;background:#f9f0eb}.price.live{background:#ffe7f0}.price small{display:block;font-size:9px;font-weight:900;color:#9b5870}.price strong{display:block;font:600 30px Georgia,serif;margin:3px 0}.price span{font-size:10px;color:var(--muted)}.say{margin-top:10px;background:linear-gradient(135deg,#ffd7e5,#fff0f5);border-radius:24px;padding:18px;position:relative;overflow:hidden}.say:after{content:'♡';position:absolute;right:12px;bottom:-22px;font:italic 72px Georgia,serif;color:#ee9fbc55}.say small{font-size:10px;font-weight:900;color:#9c345e}.sayText{font:italic 600 26px/1.14 Georgia,serif;margin-top:7px;position:relative;z-index:1}.assist{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.assist button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px 8px;font-size:10px;font-weight:800}.assist .panic{grid-column:span 2;color:white;border:0;background:linear-gradient(135deg,#ef5f91,#ca2d66)}.assist .auth{background:var(--green)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}.card b{display:block;font-size:10px;color:#a44d6f;text-transform:uppercase;margin-bottom:6px}.card div{font-size:13px;line-height:1.42}.close{background:var(--yellow)}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.fields label{display:block;font-size:9px;color:var(--muted);margin:0 0 4px 3px}.fields input{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px}.save{width:100%;border:0;border-radius:15px;padding:13px;margin-top:8px;background:linear-gradient(135deg,#ef5f91,#ca2d66);color:white;font-weight:900}.tip{margin-top:8px;background:var(--green);border-radius:14px;padding:10px 12px;font-size:11px}.tech{margin-top:9px;border:1px solid var(--line);background:white;border-radius:18px;padding:12px}.tech summary{font-weight:850;color:#94536b}.techgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.bottom{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(700px,calc(100% - 24px));background:#fffefef0;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 45px #71364a2b;backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px;z-index:40}.nav{text-align:center;font-size:9px;color:#7e6b73}.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}.nav.active{color:#e33d76;font-weight:850}@media(max-width:720px){.app{padding:10px 10px 94px}.welcome{padding:19px 16px;border-radius:26px}.welcome h1{font-size:38px}.cats{gap:4px}.catIcon{width:52px;height:52px}.grid{grid-template-columns:1fr 1fr;gap:8px}.art{height:105px}.pbody h3{font-size:15px}.rprice{font-size:17px}.head{grid-template-columns:105px 1fr}.visual{height:108px;font-size:42px}.hero h2{font-size:26px}.prices,.cards,.fields,.techgrid{grid-template-columns:1fr}.sayText{font-size:21px}.assist{grid-template-columns:1fr 1fr}.assist .panic{grid-column:1/-1}}</style></head><body><main class="app"><div class="mast"><div class="mark">BB</div><div class="brand"><strong>BELLEZA BLITZ</strong><span>Host Copilot</span></div><div class="status">♡</div></div><section id="home"><div class="welcome"><div class="hi">Hola, hermosa ✨</div><h1>¿Qué producto tienes en tu mano?</h1><p>Busca y recibe lo que necesitas para vender con confianza: hook, retail original, beneficios, objeciones y cierre.</p></div><div class="searchCard"><div class="search"><input id="q" placeholder="Busca por nombre, marca o categoría..."></div><div class="cats"><button class="cat active" data-cat="all"><span class="catIcon">✨</span>Todos</button><button class="cat" data-cat="hair"><span class="catIcon">💇‍♀️</span>Cabello</button><button class="cat" data-cat="skincare"><span class="catIcon">🫧</span>Skincare</button><button class="cat" data-cat="lip"><span class="catIcon">💋</span>Labios</button><button class="cat" data-cat="makeup"><span class="catIcon">💄</span>Makeup</button></div><div class="sectionHead"><b>Productos populares</b><span id="count"></span></div><div id="grid" class="grid"></div></div></section><section id="detail"><div class="detailTop"><button class="back" data-back>← Otro producto</button><input class="quick" id="quick" placeholder="Busca otro aquí..."></div><div id="content"></div></section></main><div class="bottom"><div class="nav active"><i>⌂</i>Inicio</div><div class="nav"><i>⌕</i>Buscar</div><div class="nav"><i>▤</i>Listas</div><div class="nav"><i>▶</i>Live</div><div class="nav"><i>♡</i>Yo</div></div><script>let DB=[],shown=[],cur=null,cat='all',bi=0;const S=JSON.parse(localStorage.getItem('bb_live_data')||'{}'),E=id=>document.getElementById(id),N=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');Promise.all(['/bellezablitz-products.json','/bellezablitz-products-wave2.json','/bellezablitz-products-wave3.json'].map(u=>fetch(u).then(r=>r.json()))).then(a=>{let m=new Map();a.flat().forEach(p=>m.set(p.id,p));DB=[...m.values()];filter()}).catch(()=>E('grid').innerHTML='<div class="empty">No pude cargar la base 💕</div>');function cm(p){let c=N(p.cat);return cat==='all'||cat==='hair'&&c.includes('hair')||cat==='skincare'&&c.includes('skin')||cat==='lip'&&c.includes('lip')||cat==='makeup'&&(c.includes('makeup')||c.includes('eye')||c.includes('brow'))}function ico(p){let c=N(p.cat);return c.includes('hair')?'💇‍♀️':c.includes('lip')?'💋':c.includes('skin')?'🫧':c.includes('body')?'🧴':'💄'}function filter(){let x=N(E('q').value);shown=DB.filter(p=>cm(p)&&N(`${p.brand} ${p.name} ${p.cat} ${p.problem||''}`).includes(x));render()}function render(){E('count').textContent=shown.length+' productos';E('grid').innerHTML=shown.map((p,i)=>`<article class="prod" data-id="${p.id}"><div class="art"><span class="badge">${i<3?'Más vendido':'Live ready'}</span><span class="heart">♡</span>${ico(p)}</div><div class="pbody"><span class="brandN">${p.brand}</span><h3>${p.name}</h3><div class="pmeta"><span class="pill">${p.cat}</span><span class="rprice">${p.retailRef||'Verificar'}</span></div></div></article>`).join('')||'<div class="empty">No lo encontré todavía.</div>'}function openP(id){cur=DB.find(p=>p.id===id);if(!cur)return;E('home').style.display='none';E('detail').style.display='block';scrollTo(0,0);bi=0;let x=S[id]||{},r=cur.retailRef||'VERIFICAR',l=x.price||'—';E('content').innerHTML=`<div class="hero"><div class="head"><div class="visual"><span class="rank">👑 Live Pick</span>${ico(cur)}</div><div><div class="eyebrow">${cur.cat} · ${cur.status||'Ready'}</div><h2>${cur.brand}<br>${cur.name}</h2><div class="meta">${cur.size||''}<br>Goodbye Inventory ${cur.gbiPrice||'verificar'}</div></div></div><div class="prices"><div class="price"><small>RETAIL ORIGINAL</small><strong>${r}</strong><span>Precio de comparación</span></div><div class="price live"><small>LIVE PRICE 🔥</small><strong>${l}</strong><span>${x.price?'Guardado para este Live':'Agrégalo al confirmar'}</span></div></div><div class="say"><small>🎙 DI ESTO AHORA</small><div id="sayText" class="sayText">${cur.hook}</div></div><div class="assist"><button class="panic" data-a="blank">ME QUEDÉ EN BLANCO →</button><button data-m="hook">Otro hook</button><button data-m="educa">Qué cuento</button><button data-m="reset">Nueva gente</button><button data-m="close">Cerrar</button><button class="auth" data-m="auth">¿Son fake?</button></div><div class="cards"><div class="card"><b>⭐ Qué estás vendiendo</b><div>${cur.what}</div></div><div class="card"><b>💗 Problema / deseo</b><div>${cur.problem}</div></div><div class="card"><b>☷ Puntos clave</b><div>${cur.benefits}</div></div><div class="card"><b>✨ Cómo se usa</b><div>${cur.how}</div></div><div class="card"><b>💬 Objeción</b><div>${cur.objection}</div></div><div class="card"><b>🛍 Cross-sell</b><div>${cur.cross}</div></div><div class="card close"><b>🔥 Cierre</b><div>${x.price?`Retail ${r}; aquí vamos en ${x.price}. ¿Quién se lo lleva?`:'Déjenme confirmar el precio del Live y se los lanzo.'}</div></div><div class="card"><b>🛡 Autenticidad</b><div>Goodbye Inventory declara que sus productos son auténticos y provienen de retailers autorizados, marcas y canales oficiales.</div></div></div><div class="fields"><div><label>PRECIO LIVE</label><input id="lp" value="${x.price||''}" placeholder="$12"></div><div><label>CANTIDAD</label><input id="lq" value="${x.qty||''}" placeholder="4"></div><div><label>CONDICIÓN</label><input id="lc" value="${x.cond||''}" placeholder="sealed / open box"></div></div><button class="save" data-a="save">GUARDAR PARA ESTE LIVE</button><div class="tip">💕 Problema → 2 beneficios → retail original → precio Live → cierre.</div><details class="tech"><summary>Ver info técnica</summary><div class="techgrid"><div class="card"><b>Para quién</b><div>${cur.forwho}</div></div><div class="card"><b>Ingredientes / activos</b><div>${cur.ingredients}</div></div></div></details></div>`}function say(t){let n=E('sayText');if(n){n.textContent=t;n.scrollIntoView({behavior:'smooth',block:'center'})}}function mode(m){if(!cur)return;let x=S[cur.id]||{},r=cur.retailRef||'VERIFICAR',A={hook:[cur.hook,`Chicas, si ${cur.problem}, miren esto.`,`¿Quién aquí usaría ${cur.name} en su rutina?`],educa:[`Lo importante: ${cur.benefits}`,`Se usa así: ${cur.how}`,`Es ideal para: ${cur.forwho}`],reset:[`Para las que acaban de entrar 💕 estamos con ${cur.name} de ${cur.brand}.`,`Si acabas de llegar: retail ${r}. Les cuento rápido qué hace.`,`Chicas nuevas, quédense porque los deals se mueven rápido.`],close:[x.price?`Retail ${r}; aquí vamos en ${x.price}. ¿Quién se lo lleva?`:'Déjenme confirmar el precio del Live.',x.qty?`Tenemos ${x.qty} confirmadas.`:'Déjenme verificar stock.',`Combínalo con: ${cur.cross}`],auth:[`No. Goodbye Inventory indica que sus productos son auténticos y vienen de retailers autorizados, marcas y canales oficiales.`,`Son productos de liquidation, overstock o closeout; por eso el precio puede ser mucho menor que retail.`,`El empaque puede variar por lote, pero Goodbye Inventory indica que no vende imitaciones ni réplicas.`]};let a=A[m]||[];if(a.length)say(a[Math.floor(Math.random()*a.length)])}function blank(){let x=S[cur.id]||{},r=cur.retailRef||'VERIFICAR',a=[cur.hook,`Lo importante es: ${cur.benefits}`,`¿A quién le pasa esto? Las leo.`,`Se usa así: ${cur.how}`,`Retail original ${r}. Aquí está el deal.`,`Cross-sell: ${cur.cross}`];if(x.price)a.push(`Retail ${r}; aquí vamos en ${x.price}. ¿Quién se lo lleva?`);bi=(bi+1)%a.length;say(a[bi])}function save(){S[cur.id]={price:E('lp').value.trim(),qty:E('lq').value.trim(),cond:E('lc').value.trim()};localStorage.setItem('bb_live_data',JSON.stringify(S));openP(cur.id)}document.addEventListener('input',e=>{if(e.target.id==='q')filter()});document.addEventListener('keydown',e=>{if(e.target.id==='quick'&&e.key==='Enter'){let x=N(e.target.value),p=DB.find(p=>N(`${p.brand} ${p.name}`).includes(x));if(p){e.target.value='';openP(p.id)}}});document.addEventListener('click',e=>{let p=e.target.closest('[data-id]');if(p)return openP(p.dataset.id);let c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b===c));return filter()}if(e.target.closest('[data-back]')){E('detail').style.display='none';E('home').style.display='block';scrollTo(0,0);return}let b=e.target.closest('button');if(!b)return;if(b.dataset.a==='blank')blank();else if(b.dataset.a==='save')save();else if(b.dataset.m)mode(b.dataset.m)});</script></body></html>
