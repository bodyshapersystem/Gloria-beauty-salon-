<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Belleza Blitz Host Copilot V4</title><style>html,body{margin:0;height:100%;background:#fff8fb}iframe{border:0;width:100%;height:100%}</style></head><body><iframe id="v3" src="/bellezablitz-host-v3.html"></iframe><script>const outer=document.getElementById('v3');outer.addEventListener('load',()=>{const v3w=outer.contentWindow,v3d=outer.contentDocument;const inner=v3d.getElementById('app');if(!inner)return;inner.addEventListener('load',()=>{const d=inner.contentDocument;const css=d.createElement('style');css.textContent='.affiliateCard{max-width:760px;margin:12px auto;background:linear-gradient(135deg,#2b1520,#7d2449);color:white;border-radius:24px;padding:18px;box-shadow:0 18px 42px #61213b33}.affiliateCard h3{font:600 23px Georgia,serif;margin:0 0 10px}.affTotal{font:600 40px Georgia,serif;margin:2px 0 4px}.affSub{font-size:10px;opacity:.75;line-height:1.4}.affStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.affStat{background:#ffffff16;border:1px solid #ffffff20;border-radius:14px;padding:10px}.affStat small{display:block;font-size:8px;opacity:.7;text-transform:uppercase;font-weight:800}.affStat b{display:block;font:600 18px Georgia,serif;margin-top:3px}.affFields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.affFields label{display:block;font-size:8px;font-weight:900;text-transform:uppercase;opacity:.75;margin-bottom:4px}.affFields input{width:100%;box-sizing:border-box;border:0;border-radius:11px;padding:10px;background:#fff;color:#2c1921}.affFormula{margin-top:10px;background:#ffffff12;border-radius:12px;padding:9px 10px;font-size:9px;line-height:1.4}.affNote{margin-top:8px;font-size:9px;opacity:.72}.affSave{margin-top:10px;width:100%;border:0;border-radius:12px;padding:11px;background:#fff;color:#9d2456;font-weight:900}@media(max-width:620px){.affStats{grid-template-columns:1fr 1fr}.affStats .affStat:last-child{grid-column:1/-1}.affFields{grid-template-columns:1fr}}';d.head.appendChild(css);function money(n){return '$'+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}function num(v){return Number(String(v||'0').replace(/[^0-9.-]/g,''))||0}function load(){try{return Object.assign({pct:'',sales:'',base:'',bonus:'',returns:'0',orders:'',period:'Esta semana'},JSON.parse(localStorage.getItem('bb_affiliate_money')||'{}'))}catch(e){return{}}}function inject(){const sheet=d.querySelector('.hostSheet');if(!sheet||sheet.querySelector('.affiliateCard'))return;const m=load(),card=d.createElement('section');card.className='affiliateCard';card.innerHTML='<h3>Mi dinero 💸</h3><div class="affTotal" id="affTotal">$0.00</div><div class="affSub">Estimado acumulado del período: base + comisión afiliada + bonos − ajustes.</div><div class="affStats"><div class="affStat"><small>Ventas afiliadas</small><b id="affSales">$0.00</b></div><div class="affStat"><small>% afiliado</small><b id="affPct">—</b></div><div class="affStat"><small>Comisión estimada</small><b id="affComm">$0.00</b></div></div><div class="affFields"><div><label>Período</label><input data-aff="period" value="'+(m.period||'')+'"></div><div><label>% afiliado</label><input inputmode="decimal" data-aff="pct" value="'+(m.pct||'')+'" placeholder="Ej. 10"></div><div><label>Ventas atribuidas ($)</label><input inputmode="decimal" data-aff="sales" value="'+(m.sales||'')+'" placeholder="Ej. 1250"></div><div><label>Órdenes atribuidas</label><input inputmode="numeric" data-aff="orders" value="'+(m.orders||'')+'" placeholder="Ej. 18"></div><div><label>Base / horas ganadas ($)</label><input inputmode="decimal" data-aff="base" value="'+(m.base||'')+'"></div><div><label>Bonos ($)</label><input inputmode="decimal" data-aff="bonus" value="'+(m.bonus||'')+'"></div><div><label>Devoluciones / ajustes ($)</label><input inputmode="decimal" data-aff="returns" value="'+(m.returns||'0')+'"></div></div><div class="affFormula" id="affFormula"></div><div class="affNote">Si distintos productos pagan porcentajes diferentes, usa aquí el porcentaje efectivo/promedio del período hasta conectar los datos reales de TikTok Shop.</div><button class="affSave">GUARDAR GANANCIAS</button>';const head=sheet.querySelector('.hostHead');head.after(card);function calc(){const g=k=>card.querySelector('[data-aff="'+k+'"]')?.value||'',sales=num(g('sales')),pct=num(g('pct')),base=num(g('base')),bonus=num(g('bonus')),returns=num(g('returns')),comm=sales*pct/100,total=Math.max(0,base+comm+bonus-returns);card.querySelector('#affTotal').textContent=money(total);card.querySelector('#affSales').textContent=money(sales);card.querySelector('#affPct').textContent=pct?pct.toFixed(1).replace('.0','')+'%':'—';card.querySelector('#affComm').textContent=money(comm);card.querySelector('#affFormula').textContent=money(sales)+' × '+(pct||0)+'% = '+money(comm)+' afiliado · + '+money(base)+' base · + '+money(bonus)+' bonos · − '+money(returns)+' ajustes = '+money(total)}card.querySelectorAll('[data-aff]').forEach(x=>x.addEventListener('input',calc));card.querySelector('.affSave').onclick=()=>{const out={};card.querySelectorAll('[data-aff]').forEach(x=>out[x.dataset.aff]=x.value.trim());localStorage.setItem('bb_affiliate_money',JSON.stringify(out));card.querySelector('.affSave').textContent='GUARDADO ✓';setTimeout(()=>card.querySelector('.affSave').textContent='GUARDAR GANANCIAS',1200)};calc()}new MutationObserver(inject).observe(d.body,{childList:true,subtree:true});inject();});});</script></body></html>
